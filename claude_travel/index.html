<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>墨爾本七日遊</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --bg:#f6f3ee; --surface:#ffffff; --ink:#1f2a37; --muted:#6b7280; --line:#e7e1d7;
  --navy:#16324f; --ochre:#c8742c;
  --spot:#0f766e; --meal:#d97706; --hotel:#7c3aed; --transport:#475569; --shop:#db2777; --near:#64748b;
  --tabs-h:64px;
  --font:-apple-system,BlinkMacSystemFont,"PingFang TC","Heiti TC","Noto Sans CJK TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.6}
header.top{background:var(--navy);color:#fff;padding:18px 20px 12px}
header.top h1{font-weight:700;font-size:22px;margin:0;letter-spacing:.05em}
header.top p{margin:2px 0 0;font-size:13px;opacity:.75}
nav.tabs{position:sticky;top:0;z-index:1000;background:var(--navy);display:flex;gap:6px;padding:0 12px;overflow-x:auto;scrollbar-width:none;height:var(--tabs-h);align-items:center}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:0 0 auto;border:0;cursor:pointer;font:inherit;font-size:14px;font-weight:500;padding:7px 14px;border-radius:999px;background:rgba(255,255,255,.1);color:#dbe4ee;transition:.15s}
nav.tabs button:hover{background:rgba(255,255,255,.2)}
nav.tabs button.on{background:var(--ochre);color:#fff}
nav.tabs button small{display:block;font-size:10px;opacity:.8;line-height:1.1}
main{display:grid;grid-template-columns:minmax(360px,440px) 1fr;height:calc(100vh - var(--tabs-h));position:sticky;top:var(--tabs-h)}
#list{overflow-y:auto;padding:18px 16px 60px;border-right:1px solid var(--line)}
#mapWrap{position:relative}
#map{position:absolute;inset:0}
.legend{position:absolute;right:10px;bottom:22px;z-index:500;background:rgba(255,255,255,.95);border-radius:10px;padding:8px 10px;font-size:12px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.legend span{display:inline-flex;align-items:center;gap:4px;margin-right:8px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}

.dayhead h2{font-weight:700;font-size:21px;margin:0 0 2px;color:var(--navy)}
.dayhead .route{font-size:13px;color:var(--muted);margin-bottom:12px}
.wx{background:linear-gradient(135deg,#fff7ec,#fff);border:1px solid #f1dfc6;border-radius:14px;padding:12px 14px;margin-bottom:16px;font-size:13.5px}
.wx .t{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.wx b.temp{font-size:20px;color:var(--ochre)}
.wx select{font:inherit;font-size:12px;border:1px solid var(--line);border-radius:8px;padding:2px 6px;background:#fff}
.wx ul{margin:6px 0 0;padding-left:18px}
.wxc{padding:8px 12px}
.wxhead{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:8px;flex-wrap:wrap;cursor:pointer;font-size:13px}
.wxhead .temp{font-size:17px}
.wxhead:focus-visible{outline:2px solid var(--ochre);outline-offset:3px;border-radius:6px}
.wxmini{font-size:12px;color:#334155;white-space:nowrap}
.wxmore{margin-left:auto;font-size:12px;color:var(--ochre);font-weight:700;white-space:nowrap}
.chev{display:inline-block;transition:transform .15s}
.wxc.open .chev{transform:rotate(180deg)}
.wxc:not(.open) .wxbody{display:none}
.wxlbl{font-size:12px;color:var(--muted)}
.wxlbl select:disabled{opacity:.6}
.wxctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.wxctl input{min-width:150px;font:inherit;font-size:12.5px;border:1px solid var(--line);border-radius:8px;padding:2px 6px;background:#fff}
.wxctl button{font:inherit;font-size:12px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:2px 10px;cursor:pointer}
.wxctl .hint{font-size:11.5px;color:var(--muted)}
.wxsrc{display:inline-block;font-size:11.5px;margin-top:6px;padding:1px 8px;border-radius:999px;background:#f1f5f9;color:#475569}
.wxsrc.forecast{background:#e0f2fe;color:#0369a1}
.wxsrc.error{background:#fef2f2;color:#b91c1c}
.wxfoot{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.5}
.eve{margin-top:8px;background:#eef6ff;border:1px solid #d6e4f5;border-radius:10px;padding:8px 10px}
.evet{font-size:12.5px;font-weight:700;color:var(--navy)}
.evegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:4px;text-align:center}
.evegrid small{display:block;font-size:11px;color:var(--muted)}
.evegrid b{font-size:16px;color:var(--navy)}
.evetip{font-size:12px;margin-top:4px}
.wxt td small{color:var(--muted);font-size:11px}
.wxt td.rain{font-size:12px;color:#0369a1;text-align:right;white-space:nowrap}
.wxt tr.sub td{border-top:0;padding-top:0;font-size:12px;color:#334155}
.tag{font-size:10.5px;padding:0 6px;border-radius:999px;background:#f1f5f9;color:#64748b;white-space:nowrap}
.tag.fc{background:#e0f2fe;color:#0369a1}
.cheat .wx.trip{margin-bottom:12px}
.wxt{width:100%;border-collapse:collapse;font-size:13px}
.wxt td{padding:4px 6px;border-top:1px dashed #f1dfc6}
.wxt td:first-child{color:var(--ochre);font-weight:700;width:36px}
.wxt td:nth-child(3){text-align:right;white-space:nowrap}
.wxt td:last-child{text-align:right}

.tl{position:relative;padding-left:4px}
.item{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;margin:0 0 10px 0;padding:12px 14px 12px 50px;cursor:pointer;transition:box-shadow .15s,border-color .15s}
.item:hover{box-shadow:0 3px 14px rgba(22,50,79,.08)}
.item.on{border-color:var(--ochre);box-shadow:0 4px 18px rgba(200,116,44,.18)}
.badge{position:absolute;left:12px;top:13px;width:28px;height:28px;border-radius:50%;color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.badge.nomap{background:#fff !important;border:2px dashed var(--line);color:var(--muted)}
.item .k{font-size:11px;font-weight:700;letter-spacing:.06em}
.item h3{margin:0;font-size:16px;line-height:1.35}
.item .en{font-size:12px;color:var(--muted)}
.item .short{font-size:13px;color:#374151;margin-top:3px}
.detail{display:none;margin-top:10px;border-top:1px dashed var(--line);padding-top:10px;font-size:13.5px}
.item.on .detail{display:block}
.detail h4{margin:10px 0 4px;font-size:13px;color:var(--navy)}
.detail ul{margin:0;padding-left:18px}
.detail li{margin:2px 0}
.near{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.near div{background:#f8fafc;border-radius:10px;padding:7px 10px}
.near div.go{cursor:pointer}
.near div.go:hover{background:#eef2f7}
.near div.on{background:#fff3e3;box-shadow:inset 3px 0 0 var(--ochre)}
.near b{font-size:13px}
.near b::after{content:"";}
.near div.go b::after{content:" 📍";font-size:11px}
.near p{margin:1px 0 0;font-size:12.5px;color:#4b5563}
/* 圖片 */
.item.has-thumb{padding-right:84px}
.item .thumb{position:absolute;right:12px;top:12px;width:62px;height:62px;object-fit:cover;border-radius:10px}
.item.on .thumb{display:none}
.item.on.has-thumb{padding-right:14px}
/* 卡片模式 */
.viewbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 0 10px}
.seg{display:inline-flex;background:#ece6dc;border-radius:999px;padding:3px}
.seg button{font:inherit;font-size:12.5px;border:0;background:transparent;border-radius:999px;padding:4px 12px;color:var(--muted);cursor:pointer}
.seg button.on{background:#fff;color:var(--navy);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.mapbtn{display:none;font:inherit;font-size:12.5px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px;cursor:pointer;color:var(--navy)}
.mapbtn.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.scnum{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 3px;border-radius:9px;color:#fff;font-size:11px;margin-right:4px}
.scdrive{font-size:11.5px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stripnav{display:flex;justify-content:center;align-items:center;gap:14px;margin:0 0 8px;font-size:12.5px;color:var(--muted)}
.stripnav button{font:inherit;font-size:17px;line-height:1;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--navy)}
.stripnav button:disabled{opacity:.35;cursor:default}
/* Trello 版型 */
.board{position:relative;display:flex;align-items:flex-start;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 7% 18px;margin:0 -16px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.board::-webkit-scrollbar{display:none}
.col{flex:0 0 86%;max-width:420px;scroll-snap-align:center;background:#e9e2d6;border-radius:16px;padding:8px;display:flex;flex-direction:column;gap:8px;opacity:.6;transition:opacity .2s}
.col.on{opacity:1}
.colhead{background:var(--surface);border-radius:12px;padding:10px 12px;border-top:4px solid var(--c);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.colhead .k{font-size:11.5px;font-weight:700;display:flex;align-items:center;flex-wrap:wrap;gap:2px}
.colhead .time{font-size:11.5px;font-weight:700;color:var(--navy);background:#eef2f7;border-radius:6px;padding:0 6px;margin-left:4px}
.colhead h3{margin:4px 0 0;font-size:17px;line-height:1.35}
.colhead .en{font-size:12px;color:var(--muted)}
.col{min-width:0}
.colhead .scdrive{white-space:normal}
.cardx{background:var(--surface);border-radius:12px;padding:10px 12px;box-shadow:0 1px 2px rgba(0,0,0,.08);font-size:13.5px}
.cardx h4{margin:0 0 4px;font-size:13px;color:var(--navy)}
.cardx ul{margin:0;padding-left:18px}
.cardx li{margin:2px 0}
.cardx p{margin:0}
.cardx .lead{color:#374151}
.cardx .photo{margin:0}
.detail .pxwrap{margin:0 0 10px}
.cardx.go{cursor:pointer}
.cardx.go b::after{content:" 📍";font-size:11px}
.cardx.go.on{background:#fff8ef;box-shadow:inset 3px 0 0 var(--ochre),0 1px 2px rgba(0,0,0,.08)}
.cardx.go p{font-size:12.5px;color:#4b5563;margin-top:1px}
.dow{display:inline-block;margin-left:8px;font-size:13px;font-weight:700;color:#fff;background:var(--ochre);border-radius:999px;padding:1px 10px;vertical-align:3px}
.closedcard{background:#fff1f0 !important;color:#b42318 !important;font-weight:700;font-size:13px;border:1px solid #f5c2bd}
.cardx .pxwrap{margin-top:6px}
.flt{border-top:1px dashed var(--line);padding:8px 0}
.flt:first-of-type{border-top:0}
.fltt{font-weight:700;font-size:13px;color:var(--navy);margin-bottom:4px}
.fltrow{display:flex;gap:8px;margin-bottom:6px}
.fltrow label{flex:1;display:flex;flex-direction:column;font-size:11.5px;color:var(--muted);gap:2px}
.fltrow input{width:100%;font:inherit;font-size:13.5px;padding:4px 8px;border:1px solid var(--line);border-radius:8px;color:var(--ink)}
.fltcalc{font-size:12.5px;color:#334155}
.flight a{color:#1a73e8}
.ptips{margin-top:8px;background:#fff;border-radius:8px;padding:6px 8px;font-size:12.5px;color:#4b5563}
.ptips b{color:#9d174d;font-size:12.5px}
.ptips ul{margin:2px 0 0;padding-left:16px}
.ptips li{margin:2px 0}
.ptips-row{margin-top:3px;color:#9d174d}
.order{background:#f0f7f4;border:1px solid #cfe5da;border-radius:12px;padding:9px 10px;font-size:13px}
.col > .order{box-shadow:0 1px 2px rgba(0,0,0,.08)}
.ohead{font-weight:700;color:#1f6b4f;margin-bottom:4px}
.orow{display:flex;gap:6px;align-items:flex-start;padding:5px 0;border-top:1px dashed #cfe5da;cursor:pointer}
.orow:first-of-type{border-top:0}
.orow input{margin-top:3px}
.othumb{flex:0 0 52px;width:52px;height:52px;object-fit:contain;background:#fff;border:1px solid #d6e9df;border-radius:8px;cursor:zoom-in}
.othumb.none{display:flex;align-items:center;justify-content:center;font-size:10.5px;color:var(--muted);cursor:default}
.osrc{margin-top:1px}
.pimg{display:flex;gap:8px;align-items:center;margin:4px 0}
.pimgs{display:flex;gap:8px;margin:6px 0 2px}
.pimgs figure{margin:0;flex:1;min-width:0;text-align:center}
.pimgs .othumb{width:100%;height:64px}
.pimgs figcaption{font-size:11px;color:#4b5563;line-height:1.35;margin-top:2px}
.pimgs a{color:#1a73e8;font-weight:600;text-decoration:none}
.pimg .osrc{font-size:11.5px;color:#6b7280}
.osrc a{color:#1a73e8;font-weight:600;text-decoration:none}
#lightbox{position:fixed;inset:0;z-index:5000;background:rgba(15,20,30,.88);display:flex;align-items:center;justify-content:center;padding:20px}
#lightbox[hidden]{display:none}
#lightbox figure{margin:0;max-width:min(92vw,520px);text-align:center}
#lightbox img{max-width:100%;max-height:70vh;background:#fff;border-radius:12px;padding:10px;box-sizing:border-box}
#lightbox figcaption{color:#fff;font-size:13.5px;margin-top:10px;line-height:1.5}
#lightbox figcaption small{color:#cbd5e1;font-size:11.5px}
#lightbox figcaption a{color:#9cc8ff}
.lbx{position:absolute;top:14px;right:14px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.15);color:#fff;font-size:20px;cursor:pointer}
.oqty{display:inline-block;font-weight:700;color:#fff;background:#2a9d8f;border-radius:6px;padding:0 5px;font-size:12px}
.otxt{font-size:13px;line-height:1.45}
.otxt b{color:var(--navy)}
.ospec{font-weight:700;color:#9d174d}
.otxt small{display:block;color:#6b7280;font-size:11.5px}
.orow.got .otxt{text-decoration:line-through;color:var(--muted)}
.onote{margin-top:6px;font-size:12px;color:#4b5563}
.ogroup{padding:6px 0 8px;border-top:1px solid var(--line)}
.ogroup:first-child{border-top:0}
.ogname{font-weight:700;font-size:13.5px;color:var(--navy);display:flex;justify-content:space-between;gap:6px;margin-bottom:2px}
.ogn{font-size:11.5px;color:var(--muted);font-weight:500;white-space:nowrap}
.ostore{display:inline-block;font-size:11px;font-weight:700;color:#334155;background:#eef2f7;border-radius:6px;padding:0 5px}
.owhere{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);font-size:12px;color:#4b5563;line-height:1.6}
.ogwhere{font-size:11.5px;color:var(--muted);margin-bottom:2px}
.opt{font-size:10.5px;font-weight:700;color:#7a3e00;background:#ffd8a8;border-radius:999px;padding:0 7px;margin-left:5px;white-space:nowrap}
.col:has(.opt) .colhead{border-top-style:dashed}
.star{font-size:10.5px;font-weight:700;color:#7a4b00;background:#ffe27a;border-radius:999px;padding:0 7px;margin-left:5px;white-space:nowrap}
.cheat .focus{background:#fff8e1;border:2px solid #ffd400}
.focus h3{color:#a5121a}
.focus h4{margin:8px 0 2px;font-size:13px;color:var(--navy)}
.fsub{font-size:13px;margin:0 0 4px;color:#4b5563}
.exnote{font-size:11.5px;color:var(--muted);margin-top:4px !important}
.cardx.notecard{background:#fff8ef;color:#9a6a2f;font-size:12.5px}
.col .prod{margin:0;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.nearlabel{font-size:12px;font-weight:700;color:var(--navy);margin:4px 4px -2px}
.pxc{width:100%;aspect-ratio:16/9;display:block;border-radius:10px;image-rendering:pixelated;image-rendering:crisp-edges;background:#000}
.pxcap{font-size:11px;color:var(--muted);margin-top:4px}
.photo{margin:0 0 10px}
.photo img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:10px;display:block;background:#eee}
.photo figcaption{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.4}
.photo figcaption a{color:inherit}
.pop-img{width:100%;height:120px;object-fit:cover;border-radius:8px;display:block;margin-bottom:6px}
/* 時間、車程、航班、採買 */
.item .time{font-size:11.5px;font-weight:700;color:var(--navy);background:#eef2f7;border-radius:6px;padding:1px 7px;margin-left:6px;letter-spacing:0}
.drive{font-size:12px;color:var(--muted);margin:-4px 0 6px 20px;padding:2px 0 2px 16px;border-left:2px dashed #cbd5e1}
.flight{margin-top:8px;background:#f0f6ff;border:1px solid #d6e4f5;border-radius:10px;padding:8px 10px;font-size:13px}
.flight b{color:var(--navy)}
.flight .route{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:2px}
.flight small{display:block;color:var(--muted);font-size:11px;margin-top:3px}
.prod{background:#fdf2f8;border:1px solid #f9d5e8;border-radius:10px;padding:9px 11px;margin:8px 0}
.prod .pn{display:flex;align-items:center;gap:8px;font-weight:700;color:#9d174d}
.prod label{margin-left:auto;font-size:12px;font-weight:500;color:var(--ink);display:flex;align-items:center;gap:4px;cursor:pointer;white-space:nowrap}
.prod p{margin:4px 0;font-size:12.5px;color:#4b5563}
.prod .price{font-size:12.5px}
.prod.got{opacity:.6}
.prod.got .pn span{text-decoration:line-through}
.shoplist .row{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-top:1px dashed var(--line)}
.shoplist .row:first-child{border-top:0}
.shoplist .row input{margin-top:4px;width:auto}
.shoplist .row.got .nm{text-decoration:line-through;color:var(--muted)}
.shoplist .nm{font-weight:700;font-size:13.5px}
.shoplist .meta{font-size:12px;color:var(--muted)}
.shoplist .del{margin-left:auto;border:0;background:none;color:var(--muted);cursor:pointer;font-size:16px}
.shoplist form{display:flex;gap:6px;margin-top:8px}
.shoplist form input{flex:1;width:auto}
.shopfoot{display:flex;gap:10px;align-items:flex-start;margin-top:8px;font-size:11px;color:var(--muted)}
.shopfoot button{flex:0 0 auto;font:inherit;font-size:12px;border:1px solid #f3b8d3;background:#fff;color:#be185d;border-radius:8px;padding:3px 10px;cursor:pointer}
.shopfoot button:hover{background:#fdf2f8}
.shoplist form button{font:inherit;font-size:13px;border:0;border-radius:8px;background:var(--navy);color:#fff;padding:4px 12px;cursor:pointer}
.gmap{display:inline-flex;align-items:center;gap:2px;margin-top:7px;font-size:12.5px;font-weight:500;color:#1a73e8;background:#e8f0fe;border-radius:999px;padding:3px 11px;text-decoration:none}
.gmap:hover{background:#d2e3fc}
.gmap.sm{font-size:11.5px;padding:1px 8px;margin-top:4px}
.leaflet-popup-content .gmap{color:#1a73e8}
.timenote{font-size:12px;color:#9a6a2f;margin:-6px 0 12px}
.note{font-size:12px;color:#9a6a2f;background:#fff8ef;border-radius:8px;padding:6px 9px;margin-top:6px}

.cheat section{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.cheat h3{margin:0 0 6px;font-size:15px;color:var(--navy)}
.cheat ul{margin:0;padding-left:18px;font-size:13.5px}
.cheat .cvt{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13.5px}
.cheat input{font:inherit;width:90px;padding:4px 8px;border:1px solid var(--line);border-radius:8px}

/* map markers */
.pin{width:30px;height:30px;border-radius:50%;color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;border:2.5px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35);transition:transform .15s}
.pin.on{transform:scale(1.3);box-shadow:0 0 0 4px rgba(200,116,44,.45),0 2px 8px rgba(0,0,0,.4)}
.npin{width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--near);box-shadow:0 1px 4px rgba(0,0,0,.3)}
.leaflet-popup-content{font-family:var(--font);font-size:13px;margin:10px 12px}
.leaflet-popup-content b{font-size:14px}

@media (max-width:820px){
  main{display:flex;flex-direction:column;height:auto;position:static}

function orderRow(o, showStore){
  const cap = `${o.brand} ${o.name} ${o.spec}`;
  return `<label class="orow ${bought[o.id]?'got':''}"><input type="checkbox" data-buy="${o.id}" ${bought[o.id]?'checked':''}>

}

function orderHTML(store){
  const list = ORDER.filter(o => o.store === store); if(!list.length) return '';
  const n = list.reduce((a, o) => a + o.qty, 0);
  return `<div class="order"><div class="ohead">📦 精選採購清單：這裡要買 ${list.length} 項、${n} 件</div>${list.map(orderRow).join('')}
    ${(ORDER_NOTES[store]||[]).length?`<div class="onote">💡 ${ORDER_NOTES[store].map(esc).join('<br>💡 ')}</div>`:''}</div>`;
}
// 小抄：完整的精選採購清單（依店家分組）
function renderOrderRows(){
  const el = document.getElementById('orderRows'); if(!el) return;
  const byId = Object.fromEntries(ORDER.map(o => [o.id, o]));
  el.innerHTML = ORDER_CATS.map(c => { const list = c.ids.map(id => byId[id]);
      return `<div class="ogroup"><div class="ogname">${c.title}<span class="ogn">${list.reduce((n, o) => n + o.qty, 0)} 件</span></div>
      ${list.map(o => orderRow(o, true)).join('')}</div>`; }).join('')
    + `<div class="owhere"><b>📍 在哪裡買</b>${Object.values(ORDER_STORES).map(st => `<div>${st.tag}：${esc(st.where)}</div>`).join('')}</div>`;
  const got = ORDER.filter(o => bought[o.id]).reduce((n, o) => n + o.qty, 0);
  document.getElementById('orderCount').textContent = `已買 ${got} / ${ORDER_TOTAL} 件`;
}

const MONTHS = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];

/* ============ 狀態 ============ */
// 出發月份只提供 10、11 月（預設 11 月）；兩個月墨爾本都在夏令時間，時差 +3，航班時間不受影響
const TRIP_MONTHS = [9,10];
let month = 10;
try{ const m = localStorage.getItem('mel_month'); if(m!==null && TRIP_MONTHS.includes(+m)) month = +m; }catch(e){}

/* ============ 天氣：歷年平均（data/climate.js）＋出發前兩週內的即時預報（Open-Meteo，免 API key） ============ */
const CLIMO = window.CLIMO || null;
const DEFAULT_START = '2026-11-10';   // 出發日期預設（D1＝出發日），可在小抄修改
let tripStart = DEFAULT_START;
// 記住使用者選的日期時，連同當時的預設值一起存；之後預設值改了，舊的選擇就作廢、改用新預設
try{
  const v = JSON.parse(localStorage.getItem('mel_start') || 'null');
  if(v && v.def === DEFAULT_START && v.d) tripStart = v.d; else localStorage.removeItem('mel_start');
}catch(e){ try{ localStorage.removeItem('mel_start'); }catch(_){} }
function syncMonthToStart(){ if(!tripStart) return; const mm = +tripStart.slice(5,7)-1; if(TRIP_MONTHS.includes(mm)) month = mm; }
syncMonthToStart();
const pad2 = n => String(n).padStart(2,'0');
const iso = dt => `${dt.getFullYear()}-${pad2(dt.getMonth()+1)}-${pad2(dt.getDate())}`;
const mmdd = date => `${+date.slice(5,7)}/${+date.slice(8,10)}`;
function dayDate(idx){ if(!tripStart) return null; const dt = new Date(tripStart+'T00:00:00'); dt.setDate(dt.getDate()+idx); return iso(dt); }
const FC_DAYS = 15;   // Open-Meteo 預報最多 16 天
function inForecastWindow(date){
  const today = new Date(); today.setHours(0,0,0,0);
  const diff = (new Date(date+'T00:00:00') - today) / 86400000;
  return diff >= 0 && diff <= FC_DAYS;
}
const fcCache = {};
function fetchForecast(loc, date, hourly){
  const k = `${loc}|${date}|${hourly?1:0}`;
  if(fcCache[k]) return fcCache[k];
  const [lat,lon] = CLIMO.locs[loc].ll;
  const q = new URLSearchParams({latitude:lat, longitude:lon, timezone:'Australia/Melbourne', start_date:date, end_date:date,
    daily:'temperature_2m_max,temperature_2m_min,precipitation_probability_max'});
  if(hourly) q.set('hourly','temperature_2m,apparent_temperature,wind_speed_10m');
  fcCache[k] = {status:'loading'};
  fetch('https://api.open-meteo.com/v1/forecast?'+q)
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(j => { fcCache[k] = {status:'ok', j}; refreshWeather(); })
    .catch(() => { fcCache[k] = {status:'err'}; refreshWeather(); });
  return fcCache[k];
}
function eveningFrom(j){   // 企鵝歸巢時段 20–21 點的平均
  const h = j.hourly; if(!h) return null;
  const idx = h.time.map((t,i)=>['20:00','21:00'].includes(t.slice(11,16))?i:-1).filter(i=>i>=0 && h.temperature_2m[i]!=null);
  if(!idx.length) return null;
  const avg = a => idx.reduce((s,i)=>s+a[i],0)/idx.length;
  return {temp:Math.round(avg(h.temperature_2m)), apparent:Math.round(avg(h.apparent_temperature)), wind:Math.round(avg(h.wind_speed_10m))};
}
function dayWx(idx){
  const w = DAYS[idx] && DAYS[idx].wx; if(!w || !CLIMO) return null;
  const date = dayDate(idx);
  let m = month; if(date){ const mm = +date.slice(5,7)-1; if(TRIP_MONTHS.includes(mm)) m = mm; }
  const c = CLIMO.locs[w.loc][m+1];
  const ce = w.evening ? CLIMO.locs[w.evening][m+1].evening : null;
  const r = {src:'climo', date, m, h:Math.round(c.max), l:Math.round(c.min), rain:c.rainPct, rainLabel:'下雨天數比例', hot:c.hot30Pct,
    eve: ce && {temp:Math.round(ce.temp), apparent:Math.round(ce.apparent), wind:Math.round(ce.wind)}};
  if(date && inForecastWindow(date)){
    const f = fetchForecast(w.loc, date, false);
    const fe = w.evening ? fetchForecast(w.evening, date, true) : null;
    if(f.status==='loading' || (fe && fe.status==='loading')) r.src = 'loading';
    else if(f.status==='ok' && f.j.daily && f.j.daily.temperature_2m_max[0]!=null){
      const dd = f.j.daily;
      Object.assign(r, {src:'forecast', h:Math.round(dd.temperature_2m_max[0]), l:Math.round(dd.temperature_2m_min[0]),
        rain:dd.precipitation_probability_max[0], rainLabel:'降雨機率', hot:null});
      if(fe && fe.status==='ok'){ const e = eveningFrom(fe.j); if(e) r.eve = e; }
    } else r.src = 'error';
  }
  return r;
}
function srcLabel(r){
  if(r.src==='forecast'){
    const today = new Date(); today.setHours(0,0,0,0);
    const ahead = Math.round((new Date(r.date+'T00:00:00') - today) / 86400000);
    return `🛰 即時預報（${mmdd(r.date)}）${ahead>7?'・7 天以上的遠期預報，僅供參考':''}`;
  }
  if(r.src==='loading') return '⏳ 讀取預報中…先顯示歷年平均';
  if(r.src==='error') return '⚠️ 預報讀取失敗，先顯示歷年平均';
  return `📊 歷年平均（${CLIMO.years} 年 ${MONTHS[r.m]}${r.date?`・${mmdd(r.date)}`:''}）`;
}
function startInfoHTML(){
  return `<span class="wxlbl">出發日 ${mmdd(tripStart)}・到「小抄」修改</span>`;
}
function eveHTML(e){
  if(!e) return '';
  const tip = e.apparent<=12 ? '體感偏冷：厚外套、毛帽、圍巾、手套' : e.apparent<=16 ? '保暖外套＋圍巾，海風吹久了會冷' : '帶一件防風外套';
  return `<div class="eve"><div class="evet">🐧 企鵝歸巢時段（20–21 點）</div>
    <div class="evegrid"><div><small>氣溫</small><b>${e.temp}°C</b></div><div><small>體感溫度</small><b>${e.apparent}°C</b></div><div><small>平均風速</small><b>${e.wind} km/h</b></div></div>
    <div class="evetip">${tip}</div></div>`;
}

/* ============ 8-bit 像素場景（照片維持原樣，像素圖是照片下方另一張卡片） ============ */
const PX = window.PIXEL_SCENES || {};
const PXS = window.PIXEL_SIZE || {w:160, h:90};
const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
function pixelHTML(it){
  if(!it.px || !PX[it.px]) return '';
  return `<div class="pxwrap"><canvas class="pxc" data-px="${it.px}" width="${PXS.w}" height="${PXS.h}" aria-label="${esc(PX[it.px].name)} 像素動畫"></canvas>
    <div class="pxcap">🎮 原創 8-bit 像素插畫${reduceMotion?'（已依系統設定停用動畫）':''}</div></div>`;
}
// 只播放畫面上看得到的畫布，捲出畫面或收合時自動暫停
const pxVisible = new Set();
const pxIO = 'IntersectionObserver' in window ? new IntersectionObserver(es => { es.forEach(e => e.isIntersecting ? pxVisible.add(e.target) : pxVisible.delete(e.target)); pxStart(); }) : null;
let pxRunning = false;
function pxStart(){ if(!pxRunning && !reduceMotion && pxVisible.size){ pxRunning = true; requestAnimationFrame(pxLoop); } }
function drawPx(cv, t){ const sc = PX[cv.dataset.px]; if(!sc) return; const ctx = cv.getContext('2d'); ctx.imageSmoothingEnabled = false; sc.draw(ctx, t); cv._t = t; }
function mountPixel(root){
  root.querySelectorAll('canvas[data-px]').forEach(cv => { if(cv._m) return; cv._m = 1; drawPx(cv, 0); if(pxIO) pxIO.observe(cv); });
}
function pxLoop(ts){
  const t = Math.floor(ts / 1000 * 12) / 12;        // 每秒 12 格，保留 8-bit 的頓點感
  pxVisible.forEach(cv => { if(!cv.isConnected){ pxVisible.delete(cv); return; } if(cv.offsetParent && cv._t !== t) drawPx(cv, t); });
  if(pxVisible.size) requestAnimationFrame(pxLoop); else pxRunning = false;   // 沒有看得到的動畫就停止
}

/* ============ 航班（可在小抄修改；改了會作廢舊的記憶，同出發日期的做法） ============ */
const DEFAULT_FLIGHTS = {
  out:  {airline:'中華航空', no:'CI057', dep:'23:30', arr:'11:50'},   // 桃園 → 墨爾本
  back: {airline:'中華航空', no:'CI058', dep:'21:50', arr:'05:40'}    // 墨爾本 → 桃園
};
const FLIGHT_SIG = JSON.stringify(DEFAULT_FLIGHTS);
let FL = JSON.parse(FLIGHT_SIG);
try{
  const v = JSON.parse(localStorage.getItem('mel_flights') || 'null');
  if(v && v.def === FLIGHT_SIG && v.fl) FL = v.fl; else localStorage.removeItem('mel_flights');
}catch(e){ try{ localStorage.removeItem('mel_flights'); }catch(_){} }
function saveFlights(){ try{ localStorage.setItem('mel_flights', JSON.stringify({fl:FL, def:FLIGHT_SIG})); }catch(e){} }
const toMin = hm => { const [h, m] = String(hm || '0:0').split(':').map(Number); return (h || 0) * 60 + (m || 0); };
// 墨爾本當天的 UTC 時差（夏令時間 +11、平常 +10），用瀏覽器內建時區資料推算
function melOffsetH(dateStr){
  try{
    const part = new Intl.DateTimeFormat('en-US', {timeZone:'Australia/Melbourne', timeZoneName:'shortOffset'})
      .formatToParts(new Date(dateStr + 'T12:00:00Z')).find(x => x.type === 'timeZoneName').value;
    const m = part.match(/GMT([+-]\d+)/); return m ? +m[1] : 11;
  }catch(e){ return 11; }
}
// 依起降時間與兩地時差推算飛行時間、抵達是否跨日
function flightCalc(key){
  const f = FL[key], out = key === 'out';
  const date = dayDate(out ? 0 : 5) || DEFAULT_START;
  const diff = (melOffsetH(date) - 8) * 60;             // 墨爾本比台灣快幾分鐘
  let dur = toMin(f.arr) - toMin(f.dep) + (out ? -diff : diff);
  while(dur <= 0) dur += 1440;
  const arrLocal = toMin(f.dep) + dur + (out ? diff : -diff);
  return {dur, h:Math.floor(dur / 60), m:dur % 60, plusDay:Math.floor(arrLocal / 1440), tz:diff / 60, odd: dur < 7 * 60 || dur > 13 * 60};
}

function updateFlightCalc(){
  ['out', 'back'].forEach(key => { const el = document.getElementById('fltcalc-' + key); if(!el) return;

}

  else if(l<=10) wear.push('保暖外套（防風款最佳）＋毛衣或刷毛衣');
  else if(l<=14) wear.push('薄外套或針織衫，早晚加一件');
  else wear.push('白天短袖即可，帶一件薄外套防溫差');

  else wear.push('墨爾本天氣多變，帶一件防水外套');

  else if(r.hot>=5) wear.push(`這個月約 ${r.hot}% 的日子會到 30°C 以上，防曬要備好`);

// 自訂資訊卡（例如蒸汽火車的座位攻略）
function extraHTML(x, cls){ return `<div class="${cls}">${listItems(x.items, esc(x.title))}${x.note?`<p class="exnote">＊${esc(x.note)}</p>`:''}</div>`; }
function listItems(lst,title,cls=''){ return lst&&lst.length?`<h4>${title}</h4><ul class="${cls}">${lst.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''; }

/* ============ 每日行程：卡片模式（左右滑動＋下方詳細內容）／列表模式 ============ */
let viewMode = 'card';
try{ const v = localStorage.getItem('mel_view'); if(v==='list' || v==='card') viewMode = v; }catch(e){}
let mapOpen = false;            // 手機版地圖是否展開（電腦版地圖一直顯示）
let pendingView = null;         // 地圖隱藏時先記住要移到哪裡，展開後再移

function mapVisible(){ return $('#mapWrap').offsetParent !== null; }
function setMapView(fn){ if(mapVisible()){ map.invalidateSize(); pendingView = null; fn(); } else pendingView = fn; }
function openMap(open){
  mapOpen = open;
  document.body.classList.toggle('map-open', mapOpen);
  const b = $('#mapBtn'); if(b){ b.classList.toggle('on', mapOpen); b.textContent = mapOpen ? '🗺 收起地圖' : '🗺 地圖'; }
  if(mapOpen) setTimeout(() => { map.invalidateSize(); if(pendingView){ const f = pendingView; pendingView = null; f(); } }, 30);
}

const WD = '日一二三四五六';
function dayDateLabel(idx){ const d = dayDate(idx); if(!d) return ''; return `${mmdd(d)}（${WD[new Date(d+'T00:00:00').getDay()]}）`; }
// 依出發日期算出這天星期幾，碰到休市日就顯示警告
function closedHTML(it, cls){
  const d = dayDate(curDay); if(!d || !it.closed) return '';
  const wd = new Date(d+'T00:00:00').getDay(); if(!it.closed.days.includes(wd)) return '';
  return `<div class="${cls||'cardx'} closedcard">⚠️ 這天是 ${mmdd(d)} 星期${WD[wd]}：${esc(it.closed.msg)}</div>`;
}
function itemNums(d){ let n = 0; return d.items.map(it => (it.ll && it.type!=='shop' && !it.optional) ? ++n : null); }
function photoFig(it){
  const ph = photo(it.img); if(!ph) return '';
  return `<figure class="photo"><img src="${ph.src}" alt="${esc(ph.caption)}" loading="lazy">
    <figcaption>${esc(ph.caption)}${ph.author?` · 📷 ${ph.source?`<a href="${esc(ph.source)}" target="_blank" rel="noopener">${esc(ph.author)}</a>`:esc(ph.author)}`:''}${ph.license?` · ${esc(ph.license)}`:''}</figcaption></figure>`;
}
// 卡片標頭：編號、類型、時間、名稱、簡介、航班、Google 地圖
function headHTML(it, num){
  const t = TYPE[it.type];
  return `<div class="badge ${it.ll?'':'nomap'}" style="background:${t.hex}">${it.optional?'☕':it.type==='shop'?'🛒':(it.ll?num:'·')}</div>
    <div class="k" style="color:${t.hex}">${t.label}${it.time?`<span class="time">${esc(it.time)}</span>`:''}${it.star?'<span class="star">⭐ 重點店家</span>':''}${it.optional?'<span class="opt">🌅 早起選配</span>':''}</div>
    <h3>${esc(it.name)}</h3>
    ${it.en?`<div class="en">${esc(it.en)}</div>`:''}
    ${it.short?`<div class="short">${esc(it.short)}</div>`:''}
    ${it.flight?flightHTML(it.flight):''}
    ${gmapBtn(it.gq)}`;
}
// 詳細內容：像素／照片、介紹、商品、必看、必買、小提醒、附近、備註
function bodyHTML(it, i){
  const prods = (it.products||[]).map(productHTML).join('');
  const hasDetail = it.intro||it.note||it.order||prods||(it.tips&&it.tips.length)||(it.see&&it.see.length)||(it.near&&it.near.length);
  if(!hasDetail) return '';
  const near = (it.near||[]).map((x,j)=>`<div class="${x.ll?'go':''}" data-near="${i}-${j}"><b>${esc(x.name)}</b><p>${esc(x.desc)}</p>${pixelHTML(x)}${gmapBtn(x.gq,true)}</div>`).join('');
  return `<div class="detail">
    ${photoFig(it)}${pixelHTML(it)}
    ${it.intro?`<div>${esc(it.intro)}</div>`:''}
    ${(it.extra||[]).map(x => extraHTML(x, '')).join('')}
    ${prods}${it.order?orderHTML(it.order):''}
    ${listItems(it.see, it.type==='spot'?'👀 必看':'👀 看點')}
    ${listItems(it.buy, it.type==='meal'?'🍽 必吃':'🛍 必買／必吃')}
    ${listItems(it.tips,'💡 小提醒')}
    ${near?`<h4>${esc(it.nearTitle||'📍 附近有趣的地方')}</h4><div class="near">${near}</div>`:''}
    ${it.note?`<div class="note">${esc(it.note)}</div>`:''}
  </div>`;
}
// 列表模式：原本的直向卡片
function listItemHTML(it, i, num){
  const ph = photo(it.img);
  return `${it.drive?`<div class="drive">🚌 ${esc(it.drive)}</div>`:''}<div class="item ${ph?'has-thumb':''}" id="i${i}" data-i="${i}">
    ${ph?`<img class="thumb" src="${ph.src}" alt="" loading="lazy">`:''}
    ${headHTML(it, num)}${closedHTML(it, 'note')}${bodyHTML(it, i)}</div>`;
}
// 卡片模式（Trello 版型）：每個行程是一整欄，欄內每段資訊都是獨立小卡片
function colHTML(it, i, num){
  const t = TYPE[it.type];
  const cards = [];
  const fig = photoFig(it), px = pixelHTML(it);
  if(fig) cards.push(`<div class="cardx">${fig}</div>`);
  if(px) cards.push(`<div class="cardx">${px}</div>`);
  const info = `${it.short?`<p class="lead">${esc(it.short)}</p>`:''}${it.flight?flightHTML(it.flight):''}${gmapBtn(it.gq)}`;
  if(info.trim()) cards.push(`<div class="cardx">${info}</div>`);
  if(it.intro) cards.push(`<div class="cardx"><h4>📖 介紹</h4><p>${esc(it.intro)}</p></div>`);
  (it.extra||[]).forEach(x => cards.push(extraHTML(x, 'cardx')));
  (it.products||[]).forEach(id => cards.push(productHTML(id)));
  if(it.order) cards.push(orderHTML(it.order));
  [[it.see, it.type==='spot'?'👀 必看':'👀 看點'], [it.buy, it.type==='meal'?'🍽 必吃':'🛍 必買／必吃'], [it.tips, '💡 小提醒']]
    .forEach(([lst, title]) => { if(lst && lst.length) cards.push(`<div class="cardx">${listItems(lst, title)}</div>`); });
  if(it.near && it.near.length){
    cards.push(`<div class="nearlabel">${esc(it.nearTitle||'📍 附近有趣的地方')}</div>`);
    it.near.forEach((x,j) => cards.push(`<div class="cardx ${x.ll?'go':''}" data-near="${i}-${j}"><b>${esc(x.name)}</b><p>${esc(x.desc)}</p>${pixelHTML(x)}${gmapBtn(x.gq,true)}</div>`));
  }
  if(it.note) cards.push(`<div class="cardx notecard">${esc(it.note)}</div>`);
  const closed = closedHTML(it); if(closed) cards.unshift(closed);
  return `<section class="col" id="i${i}" data-i="${i}" style="--c:${t.hex}" aria-label="${esc(it.name)}">
    <header class="colhead">
      <div class="k" style="color:${t.hex}"><span class="scnum" style="background:${t.hex}">${it.optional?'☕':it.type==='shop'?'🛒':(num??'·')}</span>${t.label}${it.time?`<span class="time">${esc(it.time)}</span>`:''}${it.star?'<span class="star">⭐ 重點店家</span>':''}${it.optional?'<span class="opt">🌅 早起選配</span>':''}</div>
      <h3>${esc(it.name)}</h3>
      ${it.en?`<div class="en">${esc(it.en)}</div>`:''}
      ${it.drive?`<div class="scdrive">🚌 ${esc(it.drive)}</div>`:''}
    </header>
    ${cards.join('\n    ')}
  </section>`;
}
function viewBarHTML(){
  return `<div class="viewbar"><div class="seg" role="tablist">
      <button type="button" data-view="card" class="${viewMode==='card'?'on':''}">🃏 卡片</button>
      <button type="button" data-view="list" class="${viewMode==='list'?'on':''}">☰ 列表</button></div>
    <button type="button" id="mapBtn" class="mapbtn ${mapOpen?'on':''}">${mapOpen?'🗺 收起地圖':'🗺 地圖'}</button></div>`;
}

function renderDay(){
  dayLayer.clearLayers(); nearLayer.clearLayers(); markers = {}; curItem = null;
  if(curDay===7) return renderCheat();
  const d = DAYS[curDay], nums = itemNums(d);
  const body = viewMode==='list'
    ? `<div class="tl">${d.items.map((it,i)=>listItemHTML(it,i,nums[i])).join('')}</div>`
    : `<div class="stripnav"><button type="button" data-step="-1" aria-label="上一個">‹</button><span id="stripPos"></span><button type="button" data-step="1" aria-label="下一個">›</button></div>
       <div class="board" id="board">${d.items.map((it,i)=>colHTML(it,i,nums[i])).join('')}</div>`;
  $('#list').innerHTML = `<div class="dayhead"><h2>${d.title}${dayDateLabel(curDay)?`<span class="dow">${dayDateLabel(curDay)}</span>`:''}</h2><div class="route">${d.route}</div></div>${d.timeNote?`<div class="timenote">⏱ ${d.timeNote}</div>`:''}${weatherHTML(curDay)}${viewBarHTML()}${body}`;
  mountPixel($('#list'));
  bindWx();

  // 地圖地標
  let n = 0; const pts = [], all = [];
  d.items.forEach((it,i)=>{
    if(!it.ll) return;
    all.push(it.ll);
    const shop = it.type==='shop' || it.optional;     // 採買、選配：不編號、不連路線
    if(!shop){ n++; pts.push(it.ll); }
    const m = L.marker(it.ll,{icon:pinIcon(shop?(it.optional?'☕':it.star?'⭐':'🛒'):n,it.type,false),zIndexOffset:it.star?200:it.type==='spot'?100:0})
      .bindPopup(`${photo(it.img)?`<img class="pop-img" src="${photo(it.img).src}" alt="">`:''}<b>${esc(it.name)}</b><br>${esc(it.short||'')}${it.gq?`<br>${gmapBtn(it.gq,true)}`:''}`,{maxWidth:240})
      .on('click',()=>selectItem(i,true));
    m._num = shop?(it.optional?'☕':it.star?'⭐':'🛒'):n; m._type = it.type;
    m.addTo(dayLayer); markers[i] = m;
  });
  if(pts.length>1) L.polyline(pts,{color:'#16324f',weight:2.5,opacity:.55,dashArray:'6 8'}).addTo(dayLayer);
  const uniq = all.filter((p,i)=>all.findIndex(q=>q[0]===p[0]&&q[1]===p[1])===i);
  setMapView(() => { if(uniq.length===1) map.setView(uniq[0],14); else if(uniq.length) map.fitBounds(L.latLngBounds(uniq),{padding:[40,40]}); });

  if(viewMode==='card'){ bindStrip(); selectItem(0,'init'); }
}

/* 卡片模式：停在中間的那一欄就是「目前這個行程」 */
function bindStrip(){
  const bd = $('#board'); let tm = null;
  bd.addEventListener('scroll', () => {
    clearTimeout(tm);
    tm = setTimeout(() => {
      const mid = bd.scrollLeft + bd.clientWidth / 2; let best = 0, dist = 1e9;
      bd.querySelectorAll('.col').forEach(c => { const dd = Math.abs(c.offsetLeft + c.offsetWidth / 2 - mid); if(dd < dist){ dist = dd; best = +c.dataset.i; } });
      if(best !== curItem) selectItem(best, 'strip');
    }, 110);
  }, {passive:true});
}
function scrollStripTo(i){
  const bd = $('#board'), c = bd && bd.querySelector(`.col[data-i="${i}"]`); if(!c) return;
  bd.scrollTo({left: c.offsetLeft - (bd.clientWidth - c.offsetWidth) / 2, behavior:'smooth'});
}
// 換欄時，如果新的一欄比較短、目前捲動位置已經超過它，就捲回欄位頂端
function keepColInView(i){
  const c = document.querySelector(`.col[data-i="${i}"]`), bd = $('#board'); if(!c || !bd) return;
  const desk = window.innerWidth > 820, sc = desk ? $('#list') : null;
  const viewTop = desk ? sc.getBoundingClientRect().top : $('#tabs').getBoundingClientRect().bottom + ((mapOpen && STICKY_MAP) ? $('#mapWrap').offsetHeight : 0);
  if(c.getBoundingClientRect().bottom > viewTop + 120) return;
  const delta = bd.getBoundingClientRect().top - viewTop - 50;
  if(desk) sc.scrollBy({top: delta, behavior:'smooth'}); else window.scrollBy({top: delta, behavior:'smooth'});
}
function updateNav(i){
  const n = DAYS[curDay].items.length, nav = document.querySelectorAll('.stripnav [data-step]');
  if(nav.length){ nav[0].disabled = i===0; nav[1].disabled = i===n-1; }
  const pos = $('#stripPos'); if(pos) pos.textContent = `${i+1} / ${n}`;
}

// 地圖移到這個項目（含附近景點白點）
function focusMap(i, openPopup){
  const it = DAYS[curDay].items[i];
  nearLayer.clearLayers();
  const bounds = [];
  if(it.ll) bounds.push(it.ll);
  (it.near||[]).forEach(x=>{ if(!x.ll) return; bounds.push(x.ll);
    L.marker(x.ll,{icon:nearIcon}).bindPopup(`<b>${esc(x.name)}</b><br>${esc(x.desc)}${x.gq?`<br>${gmapBtn(x.gq,true)}`:''}`).addTo(nearLayer); });
  if(!it.ll) return;
  setMapView(() => {
    if(bounds.length>1) map.flyToBounds(L.latLngBounds(bounds),{padding:[50,50],maxZoom:15,duration:.6});
    else map.flyTo(it.ll,Math.max(map.getZoom(),13),{duration:.6});
    if(openPopup) schedulePopup(()=>markers[i]&&markers[i].openPopup());
  });
}

// src：true＝點地圖地標、false＝列表點卡片、'strip'＝滑動停下、'tap'＝點小卡片、'nav'＝上一個／下一個、'init'＝剛進入這天
function selectItem(i, src){
  const fromMap = src===true;
  if(viewMode==='card'){
    if(curItem===i && src!=='init') return;
    curItem = i;
    document.querySelectorAll('.col').forEach(c => c.classList.toggle('on', +c.dataset.i===i));
    updateNav(i);
    if(fromMap || src==='nav') scrollStripTo(i);
    if(src!=='init') keepColInView(i);
    refreshPins();
    if(src==='init'){ nearLayer.clearLayers(); return; }   // 剛進入：地圖維持整天全貌
    focusMap(i, !fromMap);
    return;
  }
  // 列表模式（原本的行為：點一下展開，再點一下收合）
  if(curItem===i && !fromMap){ curItem=null; document.querySelectorAll('.item.on').forEach(e=>e.classList.remove('on')); nearLayer.clearLayers(); refreshPins(); map.closePopup(); return; }
  curItem = i;
  document.querySelectorAll('.item.on').forEach(e=>e.classList.remove('on'));
  const el = document.getElementById('i'+i); el.classList.add('on');
  refreshPins();
  focusMap(i, !fromMap);
  const top = el.getBoundingClientRect().top;
  if(window.innerWidth>820){ const list=$('#list'); list.scrollTo({top:list.scrollTop+top-list.getBoundingClientRect().top-10,behavior:'smooth'}); }
  else { const off = (mapOpen && STICKY_MAP) ? $('#mapWrap').getBoundingClientRect().bottom : $('#tabs').getBoundingClientRect().bottom; window.scrollTo({top:window.scrollY+top-off-10,behavior:'smooth'}); }
}
// 地圖飛行結束後才開彈窗；新的點擊會取消尚未執行的舊彈窗
let popupTimer = null;
function schedulePopup(fn){ clearTimeout(popupTimer); popupTimer = setTimeout(fn,650); }
function refreshPins(){ Object.entries(markers).forEach(([i,m])=>m.setIcon(pinIcon(m._num,m._type,+i===curItem))); }

$('#list').addEventListener('change',e=>{
  const cb = e.target.closest('[data-buy]');
  if(!cb) return;
  const id = cb.dataset.buy; bought[id] = cb.checked; saveShop();
  // 同一商品可能出現在多張卡片，一起更新
  document.querySelectorAll(`[data-buy="${id}"]`).forEach(x=>{ x.checked = cb.checked; const box = x.closest('.prod,.row,.orow'); if(box) box.classList.toggle('got',cb.checked); });
  if(curDay===7){ renderShopRows(); renderOrderRows(); }   // 更新「已買 n / m」
});
$('#list').addEventListener('click',e=>{
  if(e.target.closest('a')) return;   // 點作者連結時不要收合卡片
  const wb = e.target.closest('[data-wx]');
  if(wb){ wxOpen = !wxOpen; try{localStorage.setItem('mel_wx_open', wxOpen?'1':'0')}catch(_){}
    const card = wb.closest('.wxc'); card.classList.toggle('open', wxOpen); wb.setAttribute('aria-expanded', wxOpen);
    wb.querySelector('.wxmore').innerHTML = `${wxOpen?'收起':'穿搭'} <span class="chev">▾</span>`; return; }
  const vb = e.target.closest('[data-view]');
  if(vb){ if(vb.dataset.view!==viewMode){ viewMode = vb.dataset.view; try{localStorage.setItem('mel_view',viewMode)}catch(_){}; renderDay(); } return; }
  if(e.target.closest('#mapBtn')){ openMap(!mapOpen); return; }
  const stp = e.target.closest('[data-step]');
  if(stp){ const n = DAYS[curDay].items.length; selectItem(Math.min(n-1, Math.max(0, (curItem??0) + +stp.dataset.step)),'nav'); return; }
  const nd = e.target.closest('[data-near]');
  if(nd){ e.stopPropagation(); const [i,j] = nd.dataset.near.split('-').map(Number);
    const x = DAYS[curDay].items[i].near[j]; if(!x.ll) return;
    if(!mapVisible()) openMap(true);
    setMapView(() => map.flyTo(x.ll,15,{duration:.6}));
    nearLayer.eachLayer(l=>{ const p=l.getLatLng(); if(p.lat===x.ll[0]&&p.lng===x.ll[1]) schedulePopup(()=>l.openPopup()); });
    // 不捲動列表：地圖固定在上方，讀到一半的內容保持原位
    document.querySelectorAll('[data-near].on').forEach(el=>el.classList.remove('on')); nd.classList.add('on');
    return; }
  // 已展開的卡片，點內文不收合（只有點標題區才切換）
  if(e.target.closest('.item.on .detail')) return;
  const card = e.target.closest('.item');
  if(card && curDay<7 && viewMode==='list') selectItem(+card.dataset.i,false);
});

      <li>時差：比台灣快 2 小時；10 月初～4 月初夏令時間快 3 小時</li>
      <li>電壓 230V，插頭為八字型 (Type I)；手機、相機充電器多為 100–240V 可直接用</li>
      <li>緊急電話（警察、消防、救護）：<b>000</b></li>
      <li>自來水可以生飲</li></ul></section>
    <section><h3>🚋 交通</h3><ul>
      <li>市中心「Free Tram Zone」內搭電車免費</li>
      <li>出了免費區要用 <b>Myki</b> 卡，或直接用感應式信用卡／手機支付刷卡</li>
      <li>澳洲車輛靠左行駛，過馬路先看右邊</li></ul></section>
    <section><h3>💳 付款與小費</h3><ul>
      <li>幾乎處處可刷卡、感應支付，現金只需少量</li>
      <li>部分店家刷卡會加收 1～2% 手續費 (surcharge)</li>
      <li>澳洲沒有強制給小費的文化，服務好時可給約 10%</li>
      <li>週日、國定假日部分餐廳會加收 10～15% 服務費</li></ul></section>
    <section><h3>🛍 必買伴手禮清單</h3><ul>
      <li>Tim Tam 巧克力餅乾、Koko Black 巧克力（墨爾本品牌）</li>
      <li>Manuka 蜂蜜、夏威夷豆</li>
      <li>Lucas 木瓜霜、綿羊油</li>
      <li>Aesop（墨爾本起家）、Jurlique 保養品</li>
      <li>UGG 雪靴（認明 Made in Australia）</li>
      <li>雅拉河谷葡萄酒、Penfolds 紅酒</li></ul></section>
    <section><h3>🗣 實用英文</h3><ul>
      <li>G'day！— 你好（澳洲式招呼）</li>
      <li>Flat white, please. — 請給我一杯 Flat White</li>
      <li>Can I get a tax invoice? — 可以開退稅發票嗎？</li>
      <li>No worries! — 沒問題／不客氣</li></ul></section>
  </div>`;
  bindWx(); bindFlights();
  const calc = ()=>{ $('#twd').textContent = Math.round(($('#aud').value||0)*($('#rate').value||0)).toLocaleString(); };
  $('#aud').oninput = calc; calc();
  $('#rate').oninput = e => { const v = +e.target.value; if(v>0){ rate = v; try{localStorage.setItem('mel_rate',v)}catch(_){}; renderShopRows(); } calc(); };
  renderShopRows(); renderOrderRows();
  $('#shopAdd').onsubmit = e => { e.preventDefault(); const v = $('#shopNew').value.trim(); if(!v) return;
    customShop.push({id:'c'+Date.now(), name:v}); saveShop(); $('#shopNew').value=''; renderShopRows(); };
  $('#shopReset').onclick = () => {
    if(!confirm('要清除所有「已買到」的勾選，並刪除自己新增的項目嗎？（無法復原）')) return;
    bought = {}; customShop = []; saveShop(); renderShopRows(); renderOrderRows();
  };
  $('#shopRows').onclick = e => { const b = e.target.closest('.del'); if(!b) return;
    customShop = customShop.filter(x=>x.id!==b.dataset.id); delete bought[b.dataset.id]; saveShop(); renderShopRows(); };

  // 總覽地圖：顯示所有天的景點
  const colors = ['#64748b','#0f766e','#2563eb','#c026d3','#d97706','#dc2626','#64748b'];
  const pts = [];
  DAYS.forEach((d,di)=>{ if(di===0||di===6) return;
    d.items.forEach(it=>{ if(!it.ll||it.type!=='spot') return; pts.push(it.ll);
      L.marker(it.ll,{icon:L.divIcon({className:'',iconSize:[30,30],iconAnchor:[15,15],popupAnchor:[0,-14],
        html:`<div class="pin" style="background:${colors[di]};font-size:11px">D${di+1}</div>`})})
        .bindPopup(`<b>${esc(it.name)}</b><br>Day ${di+1}`).addTo(dayLayer); }); });
  setMapView(() => map.fitBounds(L.latLngBounds(pts),{padding:[30,30]}));
}

// 小抄：⭐ 重點店家 Chemist Warehouse

  const pr = PRODUCTS.chemist, ph = ORDER.filter(o => o.store === 'pharmacy');
  return `<section class="focus"><h3>⭐ 重點店家：Chemist Warehouse</h3>
    <p class="fsub">澳洲最大的平價藥妝連鎖，紅黃招牌很好認。這趟的保健品、藥妝和代購藥局品項都在這裡買。</p>
    <h4>📍 門市與時間</h4><ul>
      <li><b>D4 Chadstone</b>（1341 Dandenong Rd，購物中心內）：營業約 8:00–21:00；行程 15:30–18:00 在 Chadstone，建議第一站先來這裡</li>
      <li><b>D5 Melbourne Central</b>（地下樓層 LG 50，300 Lonsdale St）：營業約 10:00–19:00 或 21:00；D5 是星期六，建議 19:00 前到</li>
      <li>市區還有很多家分店（第三方目錄列有 Collins St、Flinders St、Bourke St 等），自由時間找最近的一家就好</li></ul>
    ${gmapBtn('Chemist Warehouse Melbourne CBD')}
    <h4>🛍 要買什麼</h4><ul>
      ${pr.prices.map(x => `<li>${esc(priceTxt(x))}</li>`).join('')}
      <li>代購（精選採購清單）藥局品項：<b>${ph.length} 項、${ph.reduce((n, o) => n + o.qty, 0)} 件</b>，在下方「📦 精選採購清單」打勾</li></ul>
    <h4>💡 現場購物技巧</h4><ul>
      <li>看黃色價格牌上的「Don't Pay RRP」，對照建議售價，常有半價特價</li>
      <li>熱門商品常有每人限購數量，代購的數量先確認</li>
      <li>部分藥品是藥師專售（Pharmacist Only），要到藥師櫃台詢問</li>
      <li>台灣入境：錠狀、膠囊狀保健食品每種最多 12 瓶，合計不超過 36 瓶（以海關最新公告為準）</li>
      <li>乳液、乳霜等液狀膏狀商品放托運行李</li>
      <li>同一家店買滿 AUD 300 可退稅，結帳時請店員開 Tax Invoice</li></ul>
    <div class="shopfoot"><span>＊營業時間各來源不一致，以現場為準；價格為官網或比價網參考價</span></div></section>`;
}
function renderShopRows(){
  const rows = PRODUCT_ORDER.map(id => [id, PRODUCTS[id]]).map(([id,pr])=>`<div class="row ${bought[id]?'got':''}">
      <input type="checkbox" data-buy="${id}" ${bought[id]?'checked':''}>
      <div><div class="nm">${esc(pr.name)}</div>${pimgHTML(pr)}
        <div class="meta">${pr.prices.map(x=>esc(priceTxt(x))).join('<br>')}</div>
        <div class="meta">📍 ${pr.where.map(esc).join('<br>📍 ')}</div>
        ${pr.tips?`<div class="meta ptips-row">⚠️ ${pr.tips.map(esc).join('<br>⚠️ ')}</div>`:''}</div></div>`)
    .concat(customShop.map(c=>`<div class="row ${bought[c.id]?'got':''}">
      <input type="checkbox" data-buy="${c.id}" ${bought[c.id]?'checked':''}>
      <div><div class="nm">${esc(c.name)}</div><div class="meta">自己新增</div></div>
      <button class="del" data-id="${c.id}" title="刪除">✕</button></div>`)).join('');
  $('#shopRows').innerHTML = rows;
  const ids = PRODUCT_ORDER.concat(customShop.map(c=>c.id));
  $('#shopCount').textContent = `已買 ${ids.filter(id=>bought[id]).length} / ${ids.length}`;
}

// fromTab：使用者點頁籤切換時，畫面捲到「頁籤剛好在最上方」（標題捲上去），不回到頁面最頂端
function selectDay(d, fromTab){
  curDay = d; try{localStorage.setItem('mel_day',d)}catch(_){}
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',+b.dataset.d===d));
  $('#list').scrollTop = 0;
  map.stop(); map.closePopup();   // 停掉上一個 flyTo，避免蓋掉新的視角
  renderDay();
  if(fromTab) window.scrollTo({top: $('header.top').offsetHeight});
  else if(window.innerWidth<=820) window.scrollTo({top:0});
  setTimeout(()=>map.invalidateSize(),50);
}

renderTabs();
selectDay(curDay>7?1:curDay);
</script>
