<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>停車服務</title>
<style>
  :root{
    --px-orange:#ff5001;      /* 全支付主色 */
    --px-yellow:#fbe57d;      /* 全支付底色 */
    --px-yellow-line:#ecc938;
    --ink:#1a1a1a;
    --ink-2:#595959;
    --line:#e7e7e7;
    --red:#bd0a0a;
    --red-bg:#fff0f0;
    --red-line:#ffc6c6;
    --blue-soft:#c6dcff;
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:#fff;font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--ink);overscroll-behavior:none}
  .app{position:relative;max-width:430px;height:100%;margin:0 auto;overflow:hidden;background:#fff}
  .screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-top:var(--safe-top)}
  .screen::-webkit-scrollbar{display:none}

  /* 截圖裁切：margin-top 百分比以寬度計算 */
  .crop{overflow:hidden;width:100%}
  .crop img{display:block;width:100%}
  .crop.top img{margin-top:-12.4%}            /* img_1 去掉截圖裡的狀態列 */
  .crop.rest img{margin-top:-35.5%}           /* img_2 去掉輪播，從活動格開始 */
  .crop.banner{aspect-ratio:2054/729}         /* img_2 只留輪播 */
  .rest-wrap{padding-bottom:calc(64px + var(--safe-bottom))}

  .tabbar{position:absolute;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:4px 6px calc(6px + var(--safe-bottom));z-index:4}
  .tabbar img{display:block;width:100%}

  /* ---- 未綁定：右下角圓形按鈕 ---- */
  .fab{position:absolute;right:16px;bottom:calc(80px + var(--safe-bottom));width:72px;height:72px;border-radius:50%;border:2px solid var(--px-yellow-line);background:var(--px-yellow);color:var(--ink);font-size:15px;font-weight:800;line-height:1.2;box-shadow:0 4px 14px rgba(0,0,0,.18);z-index:6;cursor:pointer;font-family:inherit}
  .fab:active{transform:scale(.95)}

  /* ---- 停車卡片（停車中，取代輪播位置） ---- */
  .park-slot{padding:2px 5.2% 8px}
  .park-card{background:var(--px-yellow);border:1.5px solid var(--px-yellow-line);border-radius:12px;padding:8px 14px;cursor:pointer;display:block;width:100%;text-align:left;font:inherit;color:inherit}
  .park-card:active{transform:scale(.99)}
  .pc-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .pc-left{display:flex;align-items:center;gap:8px}
  .pc-plate{font-size:19px;font-weight:800;letter-spacing:.3px}
  .pc-store{font-size:13px;font-weight:700;color:var(--px-orange);text-align:right}
  .tag{display:inline-block;background:var(--px-orange);color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px}
  .pc-bottom{display:flex;justify-content:space-between;align-items:baseline;margin-top:4px}
  .pc-more{font-size:17px}
  .pc-more b{font-size:19px}
  .pc-until{font-size:15px;font-weight:800}
  .pc-until small{font-size:12px;font-weight:400;margin-left:4px}
  .pc-max{font-size:16px;font-weight:800}

  /* ---- 明細（底部滑出） ---- */
  .dim{position:absolute;inset:0;background:rgba(26,26,26,.45);opacity:0;pointer-events:none;transition:opacity .25s;z-index:10}
  .dim.show{opacity:1;pointer-events:auto}
  .sheet{position:absolute;left:0;right:0;bottom:0;max-height:calc(100% - 60px - var(--safe-top));background:#fff;border-radius:24px 24px 0 0;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);z-index:11;display:flex;flex-direction:column}
  .sheet.show{transform:translateY(0)}
  .handle{width:44px;height:5px;border-radius:3px;background:#d0d0d0;margin:10px auto 2px;cursor:pointer}
  .sheet-body{overflow-y:auto;padding:8px 22px calc(20px + var(--safe-bottom))}
  .sh-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .sh-head h2{font-size:22px}
  .btn-rescan{border:0;background:var(--blue-soft);color:var(--ink);font-size:15px;font-weight:700;border-radius:999px;padding:8px 16px;cursor:pointer;font-family:inherit}
  .sh-plate{font-size:28px;font-weight:800}
  .sh-store{font-size:16px;font-weight:700;color:var(--px-orange);margin-bottom:10px}
  .kv{display:flex;justify-content:space-between;font-size:17px;padding:6px 0}
  .kv span{color:var(--ink-2)}
  .kv b{font-weight:800}
  hr{border:0;border-top:1px solid var(--line);margin:10px 0}
  .box{border-radius:12px;padding:12px 16px;margin-bottom:10px}
  .box .big{font-size:21px}
  .box .small{font-size:14px;color:var(--ink-2);margin-top:2px}
  .box.red{background:var(--red-bg);border:1px solid var(--red-line)}
  .box.red .big{color:var(--red)}
  .box.ok{background:#eaf9ef;border:1px solid #adf0c7}
  .box.ok .big{color:#067429}
  .box.yellow{background:var(--px-yellow);border:1px solid var(--px-yellow-line)}
  .sh-sub{font-size:17px;font-weight:800;margin:12px 0 4px}
  .rec{display:flex;justify-content:space-between;font-size:16px;padding:4px 0}
  .rec span{color:var(--ink-2)}
  .rec.new span::after{content:"補登";font-size:11px;background:var(--blue-soft);color:var(--ink);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px}
  .rules{font-size:13px;color:var(--ink-2);line-height:1.6}
  /* 只是狀態，不能按 */
  .btn-reset{display:block;margin:14px auto 0;border:1px solid #c9ced6;background:#fff;color:var(--ink-2);font-size:14px;border-radius:999px;padding:8px 16px;cursor:pointer;font-family:inherit}
  .bound-bar{margin-top:14px;background:var(--px-orange);color:#fff;text-align:center;font-weight:800;font-size:18px;border-radius:999px;padding:13px;opacity:.4;pointer-events:none;user-select:none}

  /* ---- 補登掃描（直接開相機） ---- */
  .scan{position:absolute;inset:0;background:#000;color:#fff;z-index:20;display:none;flex-direction:column}
  .scan.show{display:flex}
  .scan video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .scan canvas{display:none}
  .scan-top{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:calc(14px + var(--safe-top)) 16px 12px;background:linear-gradient(rgba(0,0,0,.6),transparent)}
  .scan-top button{background:none;border:0;color:#fff;font-size:17px;cursor:pointer;font-family:inherit;min-width:60px;text-align:left}
  .scan-top h3{font-size:18px}
  .scan-mid{position:relative;z-index:2;flex:1;display:flex;align-items:center;justify-content:center}
  .frame{position:relative;width:250px;height:250px;box-shadow:0 0 0 2000px rgba(0,0,0,.45);border-radius:14px}
  .frame i{position:absolute;width:40px;height:40px;border-color:var(--px-yellow);border-style:solid}
  .frame i:nth-child(1){top:0;left:0;border-width:5px 0 0 5px;border-radius:12px 0 0 0}
  .frame i:nth-child(2){top:0;right:0;border-width:5px 5px 0 0;border-radius:0 12px 0 0}
  .frame i:nth-child(3){bottom:0;left:0;border-width:0 0 5px 5px;border-radius:0 0 0 12px}
  .frame i:nth-child(4){bottom:0;right:0;border-width:0 5px 5px 0;border-radius:0 0 12px 0}
  .laser{position:absolute;left:12px;right:12px;height:3px;background:var(--px-orange);box-shadow:0 0 12px var(--px-orange);animation:laser 2s ease-in-out infinite}
  @keyframes laser{0%,100%{top:14px}50%{top:232px}}
  .scan-foot{position:relative;z-index:2;text-align:center;padding:14px 20px calc(30px + var(--safe-bottom));background:linear-gradient(transparent,rgba(0,0,0,.6))}
  .scan-tip{font-size:17px}
  .scan-tip2{font-size:14px;color:#ccc;margin-top:4px}
  .scan-err{display:none;margin-top:12px;font-size:14px;color:#ffc6c6;line-height:1.5}
  .scan-err.show{display:block}
  .btn-ghost{margin-top:10px;border:1px solid #888;background:transparent;color:#fff;border-radius:999px;padding:9px 18px;font-size:15px;cursor:pointer;font-family:inherit}

  /* ---- 頁面切換 ---- */
  .page{position:absolute;inset:0;background:#fff;display:none}
  .page.show{display:block}
  .tab-hit{position:absolute;top:0;bottom:0;width:20%;background:transparent;border:0;cursor:pointer}

  /* ---- 我的 ---- */
  .my-screen{background:#2459be;padding-top:var(--safe-top)}
  .my-screen > *{background:#fff}
  .full{display:block;width:100%}
  .icon-row{display:grid;grid-template-columns:repeat(4,1fr);padding:4px 0 26px;margin-top:-1px}
  .svc{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;font-family:inherit;padding:0;margin-top:-4px}
  .svc svg{width:48px;height:48px}
  .svc span{font-size:13px;color:#404557;white-space:nowrap}
  .svc:active{opacity:.6}

  /* ---- 綁定流程 ---- */
  .bind{display:none;flex-direction:column}
  .bind.show{display:flex}
  .bind-head{display:flex;align-items:center;justify-content:space-between;padding:calc(8px + var(--safe-top)) 12px 8px;border-bottom:1px solid var(--line)}
  .bind-head h1{font-size:18px}
  .back{background:none;border:0;font-size:34px;line-height:1;width:44px;height:44px;cursor:pointer;color:var(--ink)}
  .step{width:44px;text-align:right;font-size:14px;color:var(--ink-2)}
  .bind-body{flex:1;display:flex;flex-direction:column;padding:24px 22px calc(24px + var(--safe-bottom));overflow-y:auto}
  .bind-body[hidden]{display:none}
  .bind-body h2{font-size:24px}
  .bind-body .hint{font-size:16px;color:var(--ink-2);margin-top:6px;line-height:1.5}
  .grow{flex:1;min-height:24px}
  .plate-input{margin-top:24px;width:100%;font-size:34px;font-weight:800;letter-spacing:2px;text-align:center;text-transform:uppercase;padding:14px;border:2px solid var(--px-yellow-line);border-radius:14px;background:#fffbed;font-family:inherit;color:var(--ink);outline:none}
  .plate-input:focus{border-color:var(--px-orange)}
  .plate-input::placeholder{color:#c9c9c9;font-weight:700}
  .err{color:var(--red);font-size:14px;margin-top:8px;visibility:hidden}
  .err.show{visibility:visible}
  .kind{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  .kind button{font-size:18px;font-weight:700;padding:12px;border-radius:12px;border:2px solid var(--line);background:#fff;cursor:pointer;font-family:inherit;color:var(--ink-2)}
  .kind button.on{border-color:var(--px-orange);color:var(--px-orange);background:#fff5ed}
  .btn-orange{display:block;width:100%;border:0;border-radius:999px;background:var(--px-orange);color:#fff;font-size:17px;font-weight:800;padding:12px;cursor:pointer;font-family:inherit}
  .btn-orange.big{font-size:19px;padding:15px}
  .btn-orange:disabled{opacity:.35;cursor:default}
  .sum-card{margin-top:20px;border:1px solid var(--line);border-radius:14px;padding:6px 16px}
  .sum-card .row{display:flex;justify-content:space-between;font-size:17px;padding:10px 0}
  .sum-card .row+.row{border-top:1px solid var(--line)}
  .sum-card span{color:var(--ink-2)}
  .pay-card{margin-top:14px;background:var(--px-yellow);border:1.5px solid var(--px-yellow-line);border-radius:14px;padding:16px}
  .pay-name{font-size:22px;font-weight:800}
  .pay-sub{font-size:14px;margin-top:4px}
  .agree{display:flex;gap:10px;align-items:flex-start;margin-top:18px;font-size:16px;line-height:1.5;cursor:pointer}
  .agree input{width:22px;height:22px;margin-top:1px;accent-color:var(--px-orange);flex:none}
  .agree u{color:var(--px-orange);text-decoration:none}
  .done{align-items:center;text-align:center;padding-top:60px}
  .ok-mark{width:84px;height:84px;border-radius:50%;background:#eaf9ef;color:#067429;font-size:48px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-bottom:16px}
  .done-plate{font-size:30px;font-weight:800;margin-top:10px}
  .done .btn-orange{width:100%}
  .verifying{position:absolute;inset:0;background:rgba(255,255,255,.92);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-size:17px;z-index:5}
  .verifying.show{display:flex}
  .spin{width:44px;height:44px;border-radius:50%;border:4px solid var(--px-yellow);border-top-color:var(--px-orange);animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ---- 綁定流程 v2（依 Miro 稿） ---- */
  .bind-head .x{background:none;border:0;font-size:24px;width:44px;height:44px;cursor:pointer;color:var(--ink-2);font-family:inherit}
  .lbl{font-size:16px;font-weight:800;margin-top:22px}
  .lbl + .plate-input{margin-top:8px}
  .lbl + .kind{margin-top:8px}
  .btn-blue{display:block;width:100%;border:0;border-radius:999px;background:#305bab;color:#fff;font-size:19px;font-weight:800;padding:15px;cursor:pointer;font-family:inherit}
  .btn-blue:disabled{opacity:.35;cursor:default}
  .b2{padding:14px 16px calc(20px + var(--safe-bottom))}
  .st-card{border:1px solid var(--line);border-radius:12px;padding:2px 14px}
  .st-card .row{display:flex;justify-content:space-between;align-items:center;font-size:17px;padding:11px 0}
  .st-card .row+.row{border-top:1px solid var(--line)}
  .st-card span{color:var(--ink-2)}
  .st-on{color:#067429}
  .st-off{color:var(--red);font-weight:400}
  .detail-box{margin-top:14px;border:1px solid #b0b0b0;border-radius:24px;padding:16px 16px 12px}
  .pay-cta{position:relative;margin-top:14px;border-radius:12px;padding:12px 14px 14px;min-height:136px;overflow:hidden}
  .pay-cta.has{background:var(--px-yellow);border:1px solid var(--px-yellow-line)}
  .pay-cta.no{background:#d22c25;border:1px solid var(--red);color:#fff}
  .pay-cta .t{font-size:24px;font-weight:800}
  .pay-cta .pts{display:flex;gap:8px;margin-top:6px;font-size:15px;line-height:1.5}
  .pay-cta .pts i{width:4px;border-radius:2px;flex:none}
  .pay-cta.has .pts i{background:var(--px-orange)}
  .pay-cta.no .pts i{background:#fff}
  .pay-cta img{position:absolute;right:22px;top:6px;height:68px}
  .pay-cta.no img{height:72px;top:6px;border-radius:8px}
  .pay-cta button{position:absolute;right:12px;bottom:12px;border:0;border-radius:999px;font-size:17px;font-weight:800;padding:8px 18px;cursor:pointer;font-family:inherit}
  .pay-cta.has button{background:var(--px-orange);color:#fff}
  .pay-cta.no button{background:#ffe900;color:var(--ink)}
  .pay-cta.done-cta{background:#eaf9ef;border:1px solid #adf0c7;min-height:0;color:#067429;font-size:17px;font-weight:800;text-align:center;padding:14px}
  /* 卡片用 user 切的整張圖；黃卡按鈕位置疊透明點擊區 */
  .card-img{position:relative}
  .b2-foot{flex:none;background:#fff;padding:10px 16px calc(10px + var(--safe-bottom));box-shadow:0 -4px 12px rgba(0,0,0,.08)}
  .b2-foot[hidden]{display:none}
  .b2-foot .pay-cta{margin-top:0}
  .card-img img{display:block;width:100%}
  .card-img button{position:absolute;left:55%;top:68%;width:41%;height:32%;border:0;background:transparent;border-radius:999px;cursor:pointer}
  .card-img button:active{background:rgba(0,0,0,.08)}
  .bound-bar.act{opacity:1;pointer-events:auto;cursor:pointer}
  /* 授權確認（底部滑出） */
  .auth-sheet .sheet-body h2{font-size:21px;margin-bottom:4px}

  .toast{position:absolute;left:50%;bottom:calc(100px + var(--safe-bottom));transform:translateX(-50%) translateY(20px);background:rgba(26,26,26,.92);color:#fff;padding:10px 18px;border-radius:999px;font-size:15px;opacity:0;transition:all .25s;z-index:30;white-space:nowrap;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="app" id="app">

  <!-- ===== 首頁 ===== -->
  <div class="page show" id="pgHome">
    <div class="screen" id="home">
      <!-- 示範切換（隱藏）：點上半部切 img_1（已綁全支付）↔ img_4（未綁全支付）；點下半部切停車中 -->
      <div class="crop top" id="topPay"><img src="img/My%20First%20Board%20-%20%20img_1.jpg" alt="首頁上半部"></div>
      <div class="crop" id="topNoPay" hidden><img src="img/img_4_top.jpg" alt="首頁上半部（未綁全支付）"></div>
      <!-- 未綁定：原本的輪播 banner；停車中：停車卡片＋banner -->
      <div id="slot"></div>
      <div class="rest-wrap" id="restWrap">
        <div class="crop rest"><img src="img/My%20First%20Board%20-%20img_2.jpg" alt="首頁下半部"></div>
      </div>
    </div>
    <div class="tabbar">
      <img src="img/My%20First%20Board%20-%20img_3.jpg" alt="底部選單">
      <button class="tab-hit" style="left:80%" data-tab="my" aria-label="我的"></button>
    </div>
    <button class="fab" id="fab">綁定<br>車號</button>
  </div>

  <!-- ===== 我的 ===== -->
  <div class="page" id="pgMy">
    <div class="screen my-screen">
      <img class="full" src="img/my_top.jpg" alt="我的上半部">
      <div class="icon-row">
        <button class="svc" id="svcParking">
          <svg viewBox="0 0 40 40" fill="none" stroke="#404557" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 29v-7.5l3.2-7.4A2.4 2.4 0 0 1 10.4 12.6h13.2a2.4 2.4 0 0 1 2.2 1.5L29 21.5V29z"/>
            <path d="M8 21.5h18"/>
            <circle cx="10.5" cy="25" r="1.3"/><circle cx="23.5" cy="25" r="1.3"/>
            <path d="M7.5 29v3h3.5v-3M23 29v3h3.5v-3"/>
            <circle cx="30.5" cy="10.5" r="7" fill="#fff"/>
            <path d="M28.2 14.3V6.8h2.9a2.2 2.2 0 0 1 0 4.4h-2.9" stroke-width="1.8"/>
          </svg>
          <span>大全聯停車</span>
        </button>
      </div>
      <img class="full" src="img/my_list.jpg" alt="我的清單">
      <div style="height:calc(60px + var(--safe-bottom))"></div>
    </div>
    <div class="tabbar">
      <img src="img/my_tab.jpg" alt="底部選單">
      <button class="tab-hit" style="left:40%" data-tab="home" aria-label="首頁"></button>
    </div>
  </div>

  <!-- ===== 綁定車號流程 ===== -->
  <div class="page bind" id="pgBind">
    <div class="bind-head">
      <button class="back" id="bindBack" aria-label="返回">‹</button>
      <h1 id="bindTitle">綁定車號</h1>
      <button class="x" id="bindClose" aria-label="關閉">✕</button>
    </div>

    <!-- 1 綁定車號（綁定後消費自動折抵停車） -->
    <div class="bind-body" id="b1">
      <h2>綁定車號</h2>
      <p class="hint">綁定後，在大全聯消費會自動折抵停車費</p>
      <div class="lbl">車號</div>
      <input id="plateInput" class="plate-input" placeholder="1234-AB" maxlength="9" autocomplete="off" autocapitalize="characters" spellcheck="false" inputmode="text">
      <p class="err" id="plateErr">車號格式不對，例如 ABC-1234 或 1234-AB</p>
      <div class="lbl">車種</div>
      <div class="kind">
        <button class="on" data-kind="汽車">汽車</button>
        <button data-kind="機車">機車</button>
      </div>
      <div class="grow"></div>
      <button class="btn-blue" id="b1Next" disabled>綁定車號</button>
    </div>

    <!-- 2 車號綁定完成：綁定資訊＋停車明細＋全支付（2-1 已綁定→去授權扣款／2-2 未綁定→去綁定） -->
    <div class="bind-body b2" id="b2" hidden></div>
    <!-- 全支付卡片固定在螢幕下方 -->
    <div class="b2-foot" id="b2Foot" hidden></div>

    <div class="verifying" id="verifying"><div class="spin"></div><p id="verifyMsg">全支付驗證中…</p></div>
  </div>

  <!-- 授權自動扣款確認 -->
  <div class="dim" id="authDim" style="z-index:12"></div>
  <div class="sheet auth-sheet" id="authSheet" style="z-index:13" role="dialog" aria-label="授權自動扣款">
    <div class="handle" id="authHandle" title="收起"></div>
    <div class="sheet-body">
      <h2>授權出場自動扣款</h2>
      <p class="hint" style="font-size:15px;color:var(--ink-2)">出場時，停車費從全支付直接扣款，不用排隊繳費</p>
      <div class="sum-card" style="margin-top:14px">
        <div class="row"><span>車號</span><b id="authPlate"></b></div>
        <div class="row"><span>授權扣款</span><b>4563 18** **** 8899</b></div>
      </div>
      <label class="agree"><input type="checkbox" id="agree"><span>我同意<u>《停車費自動扣款約定條款》</u></span></label>
      <button class="btn-orange big" id="authOk" style="margin-top:18px" disabled>確認授權</button>
    </div>
  </div>

  <div class="dim" id="dim"></div>
  <div class="sheet" id="sheet" role="dialog" aria-label="停車明細">
    <div class="handle" id="handle" title="收起"></div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>

  <div class="scan" id="scan">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="canvas"></canvas>
    <div class="scan-top">
      <button id="scanBack">‹ 返回</button>
      <h3>停車補登</h3>
      <span style="min-width:60px"></span>
    </div>
    <div class="scan-mid"><div class="frame"><i></i><i></i><i></i><i></i><div class="laser"></div></div></div>
    <div class="scan-foot">
      <div class="scan-tip">請掃描發票左邊的 QR Code</div>
      <div class="scan-tip2">補登後，停車中台會重新計算折抵</div>
      <div class="scan-err" id="scanErr"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script>
/* ===== 示範資料（正式版由停車中台回傳） ===== */
const NOW = '13:30';
const TIERS = [            // 不疊加，取最高一級
  {min:0,    hours:1},
  {min:500,  hours:2},
  {min:1000, hours:3},
  {min:1500, hours:4},
];
const INIT = () => ({
  bound:false,     // 已綁車號（＝消費折抵停車已開啟）
  hasPay:false,    // 會員已綁定全支付（2-1）；false＝2-2
  auth:false,      // 已授權出場自動扣款
  plate:'1234-AB',
  store:'大全聯-內湖店',
  entry:'11:25',
  receipts:[
    {name:'大全聯-內湖店', amt:840},
    {name:'大全聯-內湖店 美食街', amt:120},
  ],
});
let S = INIT();
// 網址加 ?parking 直接從「停車中」開始
// 首頁版本：'pay'＝img_1 已綁全支付（預設）；'nopay'＝img_4 未綁全支付
let MODE = 'pay';
S.hasPay = true;
// 網址加 ?parking 直接停車中（已綁全支付＋已授權）
const PARKING = /[?&]parking\b/.test(location.search);
if (PARKING) Object.assign(S, {bound:true, hasPay:true, auth:true});

const $ = id => document.getElementById(id);
const dim = $('dim'), sheet = $('sheet'), scan = $('scan'), video = $('video');

/* ===== 計算 ===== */
const toMin = t => { const [h,m]=t.split(':').map(Number); return h*60+m; };
const toHM  = m => `${Math.floor(m/60)}:${String(m%60).padStart(2,'0')}`;
const money = n => '$' + n.toLocaleString('en-US');

function calc(){
  const total = S.receipts.reduce((a,r)=>a+r.amt,0);
  let idx = 0;
  TIERS.forEach((t,i)=>{ if(total>=t.min) idx=i; });
  const cur = TIERS[idx], next = TIERS[idx+1] || null;
  const entry = toMin(S.entry), now = toMin(NOW);
  const freeUntil = entry + cur.hours*60;
  return {
    total, cur, next,
    parked: now - entry,
    freeUntil: toHM(freeUntil),
    over: Math.max(0, now - freeUntil),
    need: next ? next.min - total : 0,
    nextUntil: next ? toHM(entry + next.hours*60) : null,
  };
}

/* ===== 首頁 ===== */
function renderHome(){
  const slot = $('slot');
  $('topPay').hidden = MODE!=='pay';
  $('topNoPay').hidden = MODE!=='nopay';
  $('fab').style.display = S.bound ? 'none' : '';
  const banner = `<div class="crop banner"><img src="img/My%20First%20Board%20-%20img_2.jpg" alt="輪播"></div>`;
  if(!S.bound){
    slot.innerHTML = banner;
    return;
  }
  const c = calc();
  const bottom = c.next
    ? `<div class="pc-more">再消費 <b>${money(c.need)}</b></div>
       <div class="pc-until">可停到 ${c.nextUntil}<small>免費 ${c.next.hours} 小時</small></div>`
    : `<div class="pc-max">已達最高折抵</div>
       <div class="pc-until">可停到 ${c.freeUntil}<small>免費 ${c.cur.hours} 小時</small></div>`;
  // 停車卡片插在 banner 上方，banner 保留
  slot.innerHTML = `
    <div class="park-slot">
      <button class="park-card" id="parkCard" aria-label="查看停車明細">
        <div class="pc-row">
          <span class="pc-left"><span class="pc-plate">${S.plate}</span><span class="tag">${S.auth ? '已綁定授扣' : '折抵已開啟'}</span></span>
          <span class="pc-store">${S.store}</span>
        </div>
        <div class="pc-bottom">${bottom}</div>
      </button>
    </div>${banner}`;
  $('parkCard').onclick = openSheet;
}
/* ===== 頁面切換 ===== */
function showPage(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.toggle('show', p.id===id));
}
document.querySelectorAll('.tab-hit').forEach(b=>b.onclick=()=>showPage(b.dataset.tab==='my'?'pgMy':'pgHome'));

/* ===== 綁定車號流程 v2（依 Miro 稿） =====
   1 綁定車號 → 2 車號綁定完成（綁定資訊＋停車明細＋全支付卡片）
     2-1 已綁定全支付：「去授權扣款」→ 勾條款 → 確認授權
     2-2 未綁定全支付：「去綁定」→（示意）綁好全支付 → 變成 2-1 */
let bindFrom = 'pgHome', bindKind = '汽車', bindStepNow = 1;
const PLATE_RE = /^(?=.*[A-Z])[A-Z0-9]{2,4}-[A-Z0-9]{2,4}$/;   // 例：ABC-1234、1234-AB
function bindGo(n){
  ['b1','b2'].forEach((id,i)=>$(id).hidden = (i+1)!==n);
  $('b2Foot').hidden = n!==2;
  $('bindTitle').textContent = n===1 ? '綁定車號' : '車號綁定完成';
  $('bindClose').style.visibility = n===1 ? 'hidden' : '';
  if(n===2) renderB2();
  bindStepNow = n;
}
function startBind(from){
  bindFrom = from;
  $('plateInput').value = '1234-AB'; $('plateErr').classList.remove('show'); $('b1Next').disabled = false;   // 示範：預設帶入車號
  bindGo(1); showPage('pgBind');
}
function openB2(from){ bindFrom = from; closeSheet(); bindGo(2); showPage('pgBind'); $('b2').scrollTop = 0; }
function leaveBind(to){ renderHome(); showPage(to); if(to==='pgHome') $('home').scrollTop = 0; }
$('fab').onclick = () => startBind('pgHome');
// 停車中（?parking）：從「我的」點「大全聯停車」→ 回首頁打開停車明細；其他情況都走綁定車號
$('svcParking').onclick = () => PARKING ? (showPage('pgHome'), openSheet()) : startBind('pgMy');
// 離開完成頁（‹ 或 ✕）都回到綁定前的狀態，腳本可重複走
function resetDemo(){ if(!PARKING){ S = INIT(); S.hasPay = MODE==='pay'; } }
$('bindBack').onclick = () => { if(bindStepNow===2) resetDemo(); leaveBind(bindFrom); };
$('bindClose').onclick = () => { resetDemo(); leaveBind('pgHome'); };

function renderB2(){
  // 完成頁下方只有兩種：黃卡（已綁全支付）／紅卡（未綁全支付）
  const pay = S.hasPay
    ? `<div class="card-img"><img src="img/img_yellow.png" alt="全支付：免排隊繳費、出場自動扣款"><button id="ctaAuth" aria-label="去授權扣款"></button></div>`
    : `<div class="card-img"><img src="img/img_red.png" alt="全支付：免排隊繳費，去綁定"></div>`;
  $('b2').innerHTML = `
    <div class="st-card">
      <div class="row"><span>車號</span><b>${S.plate}</b></div>
      <div class="row"><span>消費折抵停車</span><b class="st-on">已開啟</b></div>
      <div class="row"><span>出場自動扣款</span>${S.auth ? '<b class="st-on">已授權</b>' : '<b class="st-off">未設定</b>'}</div>
    </div>
    <div class="detail-box">${detailHTML(false)}</div>`;
  $('b2Foot').innerHTML = pay;
  bindDetail();
  if($('ctaAuth')) $('ctaAuth').onclick = openAuth;
  // 紅卡「去綁定」示範時不要有反應（bindPay 保留備用）
}
// 2-2 → 綁定全支付（正式版跳 App 原本的全支付綁定流程，這裡示意）
function bindPay(){
  $('verifyMsg').textContent = '前往全支付綁定…（示意）';
  $('verifying').classList.add('show');
  setTimeout(()=>{
    $('verifying').classList.remove('show');
    S.hasPay = true;
    renderB2(); renderHome();
    toast('全支付綁定完成');
  }, 1200);
}
// 2-1 → 授權自動扣款
function openAuth(){
  $('authPlate').textContent = S.plate;
  $('agree').checked = false; $('authOk').disabled = true;
  $('authDim').classList.add('show'); $('authSheet').classList.add('show');
}
function closeAuth(){ $('authDim').classList.remove('show'); $('authSheet').classList.remove('show'); }
$('authDim').onclick = closeAuth;
$('authHandle').onclick = closeAuth;
$('agree').onchange = e => $('authOk').disabled = !e.target.checked;
$('authOk').onclick = () => {
  closeAuth();
  $('verifyMsg').textContent = '全支付驗證中…';
  $('verifying').classList.add('show');
  setTimeout(()=>{
    $('verifying').classList.remove('show');
    toast('已授權出場自動扣款');
    // 從完成頁授權：授權完就回首頁（回到綁定前，腳本可重複走）
    if($('pgBind').classList.contains('show')){ resetDemo(); leaveBind('pgHome'); return; }
    S.auth = true;
    refreshDetail();
  }, 1200);
};

$('plateInput').addEventListener('input', e=>{
  const v = e.target.value.toUpperCase().replace(/[^A-Z0-9-]/g,'');   // 自動大寫、只留英數和 -
  e.target.value = v;
  const ok = PLATE_RE.test(v);
  $('b1Next').disabled = !ok;
  $('plateErr').classList.toggle('show', !ok && v.length >= 6);
});
document.querySelectorAll('.kind button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.kind button').forEach(x=>x.classList.toggle('on', x===b));
  bindKind = b.dataset.kind;
});
$('b1Next').onclick = () => {
  S.plate = $('plateInput').value;
  S.kind = bindKind;
  S.bound = true;            // 綁好車號＝消費折抵停車已開啟
  renderHome();
  bindGo(2);
  $('b2').scrollTop = 0;
};

/* ===== 明細（底部滑出的明細、綁定完成頁共用） ===== */
function detailHTML(withBar){
  const c = calc();
  const h = Math.floor(c.parked/60), m = c.parked%60;
  const payBox = c.over > 0
    ? `<div class="box red"><div class="big">目前需付 <b>$XX</b></div><div class="small">已折抵 ${c.cur.hours} 小時</div></div>`
    : `<div class="box ok"><div class="big">目前免付費</div><div class="small">已折抵 ${c.cur.hours} 小時，可停到 ${c.freeUntil}</div></div>`;
  const nextBox = c.next
    ? `<div class="box yellow"><div class="big">再消費 <b>${money(c.need)}</b>，可停到 <b>${c.nextUntil}</b></div><div class="small" style="color:var(--ink)">滿 ${money(c.next.min)} 折 ${c.next.hours} 小時</div></div>`
    : `<div class="box yellow"><div class="big">已達最高折抵 <b>${c.cur.hours} 小時</b></div></div>`;
  const recs = S.receipts.map(r=>`<div class="rec ${r.isNew?'new':''}"><span>${r.name}</span><b>${money(r.amt)}</b></div>`).join('');
  const bar = !withBar ? ''
    : S.auth   ? `<div class="bound-bar" aria-disabled="true">已綁定授扣</div>`
    : S.hasPay ? `<button class="bound-bar act" id="barAct">去授權扣款</button>`
    :            `<button class="bound-bar act" id="barAct">綁定全支付，出場自動扣款</button>`;
  return `
    <div class="sh-head"><h2>停車明細</h2><button class="btn-rescan" id="rescanBtn">停車補登</button></div>
    <div class="sh-plate">${S.plate}</div>
    <div class="sh-store">${S.store}</div>
    <div class="kv"><span>進場時間</span><b>${S.entry}</b></div>
    <div class="kv"><span>已停時間</span><b>${h} 小時 ${m} 分</b></div>
    <div class="kv"><span>目前折抵</span><b>${c.cur.hours} 小時</b></div>
    <hr>
    ${payBox}
    ${nextBox}
    <div class="sh-sub">今日消費（合計 ${money(c.total)}）</div>
    ${recs}
    <hr>
    <div class="rules">優惠：不限金額免費 1 小時、滿 $500 折 2 小時、滿 $1,000 折 3 小時、滿 $1,500 折 4 小時（取最高一級，不疊加）</div>
    ${bar}
    ${S.receipts.some(r=>r.isNew) ? `<button class="btn-reset" id="resetBtn">重設（清掉補登，回到補登前）</button>` : ''}`;
}
function bindDetail(){
  $('rescanBtn').onclick = openScan;
  if($('resetBtn')) $('resetBtn').onclick = resetRescan;
  if($('barAct')) $('barAct').onclick = () => S.hasPay ? openAuth() : openB2('pgHome');
}
function renderSheet(){ $('sheetBody').innerHTML = detailHTML(true); bindDetail(); }
function refreshDetail(){
  renderHome();
  if(sheet.classList.contains('show')) renderSheet();
  if($('pgBind').classList.contains('show') && bindStepNow===2) renderB2();
}
// 測試用：清掉所有補登，回到補登前的狀態
function resetRescan(){
  S.receipts = S.receipts.filter(r=>!r.isNew);
  usedInvoices.clear();
  refreshDetail();
  toast('已重設，回到補登前');
}
function openSheet(){ renderSheet(); dim.classList.add('show'); sheet.classList.add('show'); }
function closeSheet(){ dim.classList.remove('show'); sheet.classList.remove('show'); }
dim.onclick = closeSheet;
$('handle').onclick = closeSheet;
(function(){ // 往下滑收起
  let y0=null;
  sheet.addEventListener('touchstart',e=>{ if($('sheetBody').scrollTop<=0) y0=e.touches[0].clientY; },{passive:true});
  sheet.addEventListener('touchend',e=>{ if(y0!==null && e.changedTouches[0].clientY-y0>80) closeSheet(); y0=null; });
})();

/* ===== 補登：直接開相機，掃電子發票左邊 QR Code ===== */
let stream = null, scanning = false;
const usedInvoices = new Set();

async function openScan(){
  scan.classList.add('show');
  showErr('');
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    showErr('這個網址無法開相機。手機需要用 https 網址開啟這個頁面。');
    return;
  }
  try{
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
    video.srcObject = stream;
    await video.play();
    scanning = true;
    requestAnimationFrame(tick);
  }catch(e){
    showErr('沒有開啟相機權限。請到瀏覽器設定允許相機後再試一次。');
  }
}
function closeScan(){
  scanning = false;
  scan.classList.remove('show');
  if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }
  video.srcObject = null;
}
function showErr(msg){ const e=$('scanErr'); e.textContent=msg; e.classList.toggle('show',!!msg); }
$('scanBack').onclick = closeScan;

const canvas = $('canvas'), ctx = canvas.getContext('2d',{willReadFrequently:true});
let lastTick = 0;
function tick(t){
  if(!scanning) return;
  if(t - lastTick > 150 && video.readyState >= 2 && window.jsQR){
    lastTick = t;
    const w = video.videoWidth, h = video.videoHeight;
    const s = Math.min(1, 720 / Math.max(w,h));
    canvas.width = Math.round(w*s); canvas.height = Math.round(h*s);
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    const img = ctx.getImageData(0,0,canvas.width,canvas.height);
    const code = jsQR(img.data, img.width, img.height, {inversionAttempts:'dontInvert'});
    if(code && code.data && handleCode(code.data)) return;
  }
  requestAnimationFrame(tick);
}

// 掃到任何 QR Code 都算補登成功（prototype）。
// 如果是電子發票左邊 QR（第 1-10 碼發票號碼、30-37 碼總計額 16 進位），就用發票上的金額；其他 QR 一律補 $50。
const DEMO_AMT = 50;
let lastBad = 0;
function handleCode(txt){
  const m = /^([A-Z]{2}\d{8})(\d{7})(\d{4})([0-9a-fA-F]{8})([0-9a-fA-F]{8})/.exec(txt);
  let name = '補登消費', amt = DEMO_AMT;
  if(m){
    const no = m[1];
    if(usedInvoices.has(no)){
      if(Date.now()-lastBad > 2500){ toast('這張發票已經補登過了'); lastBad = Date.now(); }
      return false;
    }
    usedInvoices.add(no);
    name = '補登發票 ' + no;
    amt = parseInt(m[5],16) || DEMO_AMT;
  }
  S.receipts.push({name, amt, isNew:true});
  closeScan();
  refreshDetail();
  toast(`補登成功 +${money(amt)}，已重新計算`);
  return true;
}

/* ===== 共用 ===== */
let tt;
function toast(msg){
  const t = $('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(tt); tt = setTimeout(()=>t.classList.remove('show'), 2200);
}

/* ===== 示範用隱藏切換 ===== */
// 點首頁上半部：img_1 ↔ img_4；停車中時點上半部回到 1-1
function toggleTop(){
  if(PARKING){ location.href = location.pathname; return; }
  MODE = MODE==='pay' ? 'nopay' : 'pay';
  S.hasPay = MODE==='pay';
  renderHome();
}
$('topPay').onclick = toggleTop;
$('topNoPay').onclick = toggleTop;
// 點下半部（輪播＋商品）：img_1 版本切到停車中；停車中再點一次切回首頁（1-1）
function goParking(e){
  if(e.target.closest('#parkCard')) return;
  if(PARKING){ location.href = location.pathname; return; }
  if(MODE!=='pay') return;
  location.href = location.pathname + '?parking';
}
$('restWrap').onclick = goParking;
$('slot').onclick = goParking;

renderHome();
</script>
</body>
</html>
