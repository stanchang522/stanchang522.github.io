<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>停車服務</title>
<style>
  :root{
    --px-orange:#ff5001;      /* 全支付主色 */
    --px-yellow:#fbe57d;      /* 全支付底色 */
    --px-yellow-line:#ecc938;
    --ink:#1a1a1a;
    --ink-2:#595959;
    --line:#e7e7e7;
    --red:#bd0a0a;
    --red-bg:#fff0f0;
    --red-line:#ffc6c6;
    --blue-soft:#c6dcff;
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:#fff;font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--ink);overscroll-behavior:none}
  .app{position:relative;max-width:430px;height:100%;margin:0 auto;overflow:hidden;background:#fff}
  .screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-top:var(--safe-top)}
  .screen::-webkit-scrollbar{display:none}

  /* 截圖裁切：margin-top 百分比以寬度計算 */
  .crop{overflow:hidden;width:100%}
  .crop img{display:block;width:100%}
  .crop.top img{margin-top:-12.4%}            /* img_1 去掉截圖裡的狀態列 */
  .crop.rest img{margin-top:-35.5%}           /* img_2 去掉輪播，從活動格開始 */
  .crop.banner{aspect-ratio:2054/729}         /* img_2 只留輪播 */
  .rest-wrap{padding-bottom:calc(64px + var(--safe-bottom))}

  .tabbar{position:absolute;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:4px 6px calc(6px + var(--safe-bottom));z-index:4}
  .tabbar img{display:block;width:100%}

  /* ---- 未綁定：右下角圓形按鈕 ---- */
  .fab{position:absolute;right:16px;bottom:calc(80px + var(--safe-bottom));width:72px;height:72px;border-radius:50%;border:2px solid var(--px-yellow-line);background:var(--px-yellow);color:var(--ink);font-size:15px;font-weight:800;line-height:1.2;box-shadow:0 4px 14px rgba(0,0,0,.18);z-index:6;cursor:pointer;font-family:inherit}
  .fab:active{transform:scale(.95)}

  /* ---- 停車卡片（停車中，取代輪播位置） ---- */
  .park-slot{padding:2px 5.2% 8px}
  .park-card{background:var(--px-yellow);border:1.5px solid var(--px-yellow-line);border-radius:12px;padding:8px 14px;cursor:pointer;display:block;width:100%;text-align:left;font:inherit;color:inherit}
  .park-card:active{transform:scale(.99)}
  .pc-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .pc-left{display:flex;align-items:center;gap:8px}
  .pc-plate{font-size:19px;font-weight:800;letter-spacing:.3px}
  .pc-store{font-size:13px;font-weight:700;color:var(--px-orange);text-align:right}
  .tag{display:inline-block;background:var(--px-orange);color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px}
  .pc-bottom{display:flex;justify-content:space-between;align-items:baseline;margin-top:4px}
  .pc-more{font-size:17px}
  .pc-more b{font-size:19px}
  .pc-until{font-size:15px;font-weight:800}
  .pc-until small{font-size:12px;font-weight:400;margin-left:4px}
  .pc-max{font-size:16px;font-weight:800}

  /* ---- 明細（底部滑出） ---- */
  .dim{position:absolute;inset:0;background:rgba(26,26,26,.45);opacity:0;pointer-events:none;transition:opacity .25s;z-index:10}
  .dim.show{opacity:1;pointer-events:auto}
  .sheet{position:absolute;left:0;right:0;bottom:0;max-height:calc(100% - 60px - var(--safe-top));background:#fff;border-radius:24px 24px 0 0;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);z-index:11;display:flex;flex-direction:column}
  .sheet.show{transform:translateY(0)}
  .handle{width:44px;height:5px;border-radius:3px;background:#d0d0d0;margin:10px auto 2px;cursor:pointer}
  .sheet-body{overflow-y:auto;padding:8px 22px calc(20px + var(--safe-bottom))}
  .sh-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .sh-head h2{font-size:22px}
  .btn-rescan{border:0;background:var(--blue-soft);color:var(--ink);font-size:15px;font-weight:700;border-radius:999px;padding:8px 16px;cursor:pointer;font-family:inherit}
  .sh-plate{font-size:28px;font-weight:800}
  .sh-store{font-size:16px;font-weight:700;color:var(--px-orange);margin-bottom:10px}
  .kv{display:flex;justify-content:space-between;font-size:17px;padding:6px 0}
  .kv span{color:var(--ink-2)}
  .kv b{font-weight:800}
  hr{border:0;border-top:1px solid var(--line);margin:10px 0}
  .box{border-radius:12px;padding:12px 16px;margin-bottom:10px}
  .box .big{font-size:21px}
  .box .small{font-size:14px;color:var(--ink-2);margin-top:2px}
  .box.red{background:var(--red-bg);border:1px solid var(--red-line)}
  .box.red .big{color:var(--red)}
  .box.ok{background:#eaf9ef;border:1px solid #adf0c7}
  .box.ok .big{color:#067429}
  .box.yellow{background:var(--px-yellow);border:1px solid var(--px-yellow-line)}
  .sh-sub{font-size:17px;font-weight:800;margin:12px 0 4px}
  .rec{display:flex;justify-content:space-between;font-size:16px;padding:4px 0}
  .rec span{color:var(--ink-2)}
  .rec.new span::after{content:"補登";font-size:11px;background:var(--blue-soft);color:var(--ink);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px}
  .rules{font-size:13px;color:var(--ink-2);line-height:1.6}
  /* 只是狀態，不能按 */
  .btn-reset{display:block;margin:14px auto 0;border:1px solid #c9ced6;background:#fff;color:var(--ink-2);font-size:14px;border-radius:999px;padding:8px 16px;cursor:pointer;font-family:inherit}
  .bound-bar{margin-top:14px;background:var(--px-orange);color:#fff;text-align:center;font-weight:800;font-size:18px;border-radius:999px;padding:13px;opacity:.4;pointer-events:none;user-select:none}

  /* ---- 補登掃描（直接開相機） ---- */
  .scan{position:absolute;inset:0;background:#000;color:#fff;z-index:20;display:none;flex-direction:column}
  .scan.show{display:flex}
  .scan video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .scan canvas{display:none}
  .scan-top{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:calc(14px + var(--safe-top)) 16px 12px;background:linear-gradient(rgba(0,0,0,.6),transparent)}
  .scan-top button{background:none;border:0;color:#fff;font-size:17px;cursor:pointer;font-family:inherit;min-width:60px;text-align:left}
  .scan-top h3{font-size:18px}
  .scan-mid{position:relative;z-index:2;flex:1;display:flex;align-items:center;justify-content:center}
  .frame{position:relative;width:250px;height:250px;box-shadow:0 0 0 2000px rgba(0,0,0,.45);border-radius:14px}
  .frame i{position:absolute;width:40px;height:40px;border-color:var(--px-yellow);border-style:solid}
  .frame i:nth-child(1){top:0;left:0;border-width:5px 0 0 5px;border-radius:12px 0 0 0}
  .frame i:nth-child(2){top:0;right:0;border-width:5px 5px 0 0;border-radius:0 12px 0 0}
  .frame i:nth-child(3){bottom:0;left:0;border-width:0 0 5px 5px;border-radius:0 0 0 12px}
  .frame i:nth-child(4){bottom:0;right:0;border-width:0 5px 5px 0;border-radius:0 0 12px 0}
  .laser{position:absolute;left:12px;right:12px;height:3px;background:var(--px-orange);box-shadow:0 0 12px var(--px-orange);animation:laser 2s ease-in-out infinite}
  @keyframes laser{0%,100%{top:14px}50%{top:232px}}
  .scan-foot{position:relative;z-index:2;text-align:center;padding:14px 20px calc(30px + var(--safe-bottom));background:linear-gradient(transparent,rgba(0,0,0,.6))}
  .scan-tip{font-size:17px}
  .scan-tip2{font-size:14px;color:#ccc;margin-top:4px}
  .scan-err{display:none;margin-top:12px;font-size:14px;color:#ffc6c6;line-height:1.5}
  .scan-err.show{display:block}
  .btn-ghost{margin-top:10px;border:1px solid #888;background:transparent;color:#fff;border-radius:999px;padding:9px 18px;font-size:15px;cursor:pointer;font-family:inherit}

  .toast{position:absolute;left:50%;bottom:calc(100px + var(--safe-bottom));transform:translateX(-50%) translateY(20px);background:rgba(26,26,26,.92);color:#fff;padding:10px 18px;border-radius:999px;font-size:15px;opacity:0;transition:all .25s;z-index:30;white-space:nowrap;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="app" id="app">

  <div class="screen" id="home">
    <div class="crop top"><img src="img/My%20First%20Board%20-%20%20img_1.jpg" alt="首頁上半部"></div>
    <!-- 未綁定：原本的輪播 banner；停車中：停車卡片 -->
    <div id="slot"></div>
    <div class="rest-wrap">
      <div class="crop rest"><img src="img/My%20First%20Board%20-%20img_2.jpg" alt="首頁下半部"></div>
    </div>
  </div>

  <div class="tabbar"><img src="img/My%20First%20Board%20-%20img_3.jpg" alt="底部選單"></div>

  <button class="fab" id="fab">綁定<br>車號</button>

  <div class="dim" id="dim"></div>
  <div class="sheet" id="sheet" role="dialog" aria-label="停車明細">
    <div class="handle" id="handle" title="收起"></div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>

  <div class="scan" id="scan">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="canvas"></canvas>
    <div class="scan-top">
      <button id="scanBack">‹ 返回</button>
      <h3>停車補登</h3>
      <span style="min-width:60px"></span>
    </div>
    <div class="scan-mid"><div class="frame"><i></i><i></i><i></i><i></i><div class="laser"></div></div></div>
    <div class="scan-foot">
      <div class="scan-tip">請掃描發票左邊的 QR Code</div>
      <div class="scan-tip2">補登後，停車中台會重新計算折抵</div>
      <div class="scan-err" id="scanErr"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script>
/* ===== 示範資料（正式版由停車中台回傳） ===== */
const NOW = '13:30';
const TIERS = [            // 不疊加，取最高一級
  {min:0,    hours:1},
  {min:500,  hours:2},
  {min:1000, hours:3},
  {min:1500, hours:4},
];
const INIT = () => ({
  bound:false,
  plate:'1234-AB',
  store:'大全聯-內湖店',
  entry:'11:25',
  receipts:[
    {name:'大全聯-內湖店', amt:840},
    {name:'大全聯-內湖店 美食街', amt:120},
  ],
});
let S = INIT();
// 網址加 ?parking 直接從「停車中」開始
if (/[?&]parking\b/.test(location.search)) S.bound = true;

const $ = id => document.getElementById(id);
const dim = $('dim'), sheet = $('sheet'), scan = $('scan'), video = $('video');

/* ===== 計算 ===== */
const toMin = t => { const [h,m]=t.split(':').map(Number); return h*60+m; };
const toHM  = m => `${Math.floor(m/60)}:${String(m%60).padStart(2,'0')}`;
const money = n => '$' + n.toLocaleString('en-US');

function calc(){
  const total = S.receipts.reduce((a,r)=>a+r.amt,0);
  let idx = 0;
  TIERS.forEach((t,i)=>{ if(total>=t.min) idx=i; });
  const cur = TIERS[idx], next = TIERS[idx+1] || null;
  const entry = toMin(S.entry), now = toMin(NOW);
  const freeUntil = entry + cur.hours*60;
  return {
    total, cur, next,
    parked: now - entry,
    freeUntil: toHM(freeUntil),
    over: Math.max(0, now - freeUntil),
    need: next ? next.min - total : 0,
    nextUntil: next ? toHM(entry + next.hours*60) : null,
  };
}

/* ===== 首頁 ===== */
function renderHome(){
  const slot = $('slot');
  $('fab').style.display = S.bound ? 'none' : '';
  const banner = `<div class="crop banner"><img src="img/My%20First%20Board%20-%20img_2.jpg" alt="輪播"></div>`;
  if(!S.bound){
    slot.innerHTML = banner;
    return;
  }
  const c = calc();
  const bottom = c.next
    ? `<div class="pc-more">再消費 <b>${money(c.need)}</b></div>
       <div class="pc-until">可停到 ${c.nextUntil}<small>免費 ${c.next.hours} 小時</small></div>`
    : `<div class="pc-max">已達最高折抵</div>
       <div class="pc-until">可停到 ${c.freeUntil}<small>免費 ${c.cur.hours} 小時</small></div>`;
  // 停車卡片插在 banner 上方，banner 保留
  slot.innerHTML = `
    <div class="park-slot">
      <button class="park-card" id="parkCard" aria-label="查看停車明細">
        <div class="pc-row">
          <span class="pc-left"><span class="pc-plate">${S.plate}</span><span class="tag">已綁定授扣</span></span>
          <span class="pc-store">${S.store}</span>
        </div>
        <div class="pc-bottom">${bottom}</div>
      </button>
    </div>${banner}`;
  $('parkCard').onclick = openSheet;
}
$('fab').onclick = () => { S.bound = true; renderHome(); toast('已綁定車號 ' + S.plate + '（示意）'); };

/* ===== 明細 ===== */
function renderSheet(){
  const c = calc();
  const h = Math.floor(c.parked/60), m = c.parked%60;
  const payBox = c.over > 0
    ? `<div class="box red"><div class="big">目前需付 <b>$XX</b></div><div class="small">已折抵 ${c.cur.hours} 小時</div></div>`
    : `<div class="box ok"><div class="big">目前免付費</div><div class="small">已折抵 ${c.cur.hours} 小時，可停到 ${c.freeUntil}</div></div>`;
  const nextBox = c.next
    ? `<div class="box yellow"><div class="big">再消費 <b>${money(c.need)}</b>，可停到 <b>${c.nextUntil}</b></div><div class="small" style="color:var(--ink)">滿 ${money(c.next.min)} 折 ${c.next.hours} 小時</div></div>`
    : `<div class="box yellow"><div class="big">已達最高折抵 <b>${c.cur.hours} 小時</b></div></div>`;
  const recs = S.receipts.map(r=>`<div class="rec ${r.isNew?'new':''}"><span>${r.name}</span><b>${money(r.amt)}</b></div>`).join('');
  $('sheetBody').innerHTML = `
    <div class="sh-head"><h2>停車明細</h2><button class="btn-rescan" id="rescanBtn">停車補登</button></div>
    <div class="sh-plate">${S.plate}</div>
    <div class="sh-store">${S.store}</div>
    <div class="kv"><span>進場時間</span><b>${S.entry}</b></div>
    <div class="kv"><span>已停時間</span><b>${h} 小時 ${m} 分</b></div>
    <div class="kv"><span>目前折抵</span><b>${c.cur.hours} 小時</b></div>
    <hr>
    ${payBox}
    ${nextBox}
    <div class="sh-sub">今日消費（合計 ${money(c.total)}）</div>
    ${recs}
    <hr>
    <div class="rules">優惠：不限金額免費 1 小時、滿 $500 折 2 小時、滿 $1,000 折 3 小時、滿 $1,500 折 4 小時（取最高一級，不疊加）</div>
    <div class="bound-bar" aria-disabled="true">已綁定授扣</div>
    ${S.receipts.some(r=>r.isNew) ? `<button class="btn-reset" id="resetBtn">重設（清掉補登，回到補登前）</button>` : ''}`;
  $('rescanBtn').onclick = openScan;
  if($('resetBtn')) $('resetBtn').onclick = resetRescan;
}
// 測試用：清掉所有補登，回到補登前的狀態
function resetRescan(){
  S.receipts = S.receipts.filter(r=>!r.isNew);
  usedInvoices.clear();
  renderHome(); renderSheet();
  toast('已重設，回到補登前');
}
function openSheet(){ renderSheet(); dim.classList.add('show'); sheet.classList.add('show'); }
function closeSheet(){ dim.classList.remove('show'); sheet.classList.remove('show'); }
dim.onclick = closeSheet;
$('handle').onclick = closeSheet;
(function(){ // 往下滑收起
  let y0=null;
  sheet.addEventListener('touchstart',e=>{ if($('sheetBody').scrollTop<=0) y0=e.touches[0].clientY; },{passive:true});
  sheet.addEventListener('touchend',e=>{ if(y0!==null && e.changedTouches[0].clientY-y0>80) closeSheet(); y0=null; });
})();

/* ===== 補登：直接開相機，掃電子發票左邊 QR Code ===== */
let stream = null, scanning = false;
const usedInvoices = new Set();

async function openScan(){
  scan.classList.add('show');
  showErr('');
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    showErr('這個網址無法開相機。手機需要用 https 網址開啟這個頁面。');
    return;
  }
  try{
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
    video.srcObject = stream;
    await video.play();
    scanning = true;
    requestAnimationFrame(tick);
  }catch(e){
    showErr('沒有開啟相機權限。請到瀏覽器設定允許相機後再試一次。');
  }
}
function closeScan(){
  scanning = false;
  scan.classList.remove('show');
  if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }
  video.srcObject = null;
}
function showErr(msg){ const e=$('scanErr'); e.textContent=msg; e.classList.toggle('show',!!msg); }
$('scanBack').onclick = closeScan;

const canvas = $('canvas'), ctx = canvas.getContext('2d',{willReadFrequently:true});
let lastTick = 0;
function tick(t){
  if(!scanning) return;
  if(t - lastTick > 150 && video.readyState >= 2 && window.jsQR){
    lastTick = t;
    const w = video.videoWidth, h = video.videoHeight;
    const s = Math.min(1, 720 / Math.max(w,h));
    canvas.width = Math.round(w*s); canvas.height = Math.round(h*s);
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    const img = ctx.getImageData(0,0,canvas.width,canvas.height);
    const code = jsQR(img.data, img.width, img.height, {inversionAttempts:'dontInvert'});
    if(code && code.data && handleCode(code.data)) return;
  }
  requestAnimationFrame(tick);
}

// 掃到任何 QR Code 都算補登成功（prototype）。
// 如果是電子發票左邊 QR（第 1-10 碼發票號碼、30-37 碼總計額 16 進位），就用發票上的金額；其他 QR 一律補 $50。
const DEMO_AMT = 50;
let lastBad = 0;
function handleCode(txt){
  const m = /^([A-Z]{2}\d{8})(\d{7})(\d{4})([0-9a-fA-F]{8})([0-9a-fA-F]{8})/.exec(txt);
  let name = '補登消費', amt = DEMO_AMT;
  if(m){
    const no = m[1];
    if(usedInvoices.has(no)){
      if(Date.now()-lastBad > 2500){ toast('這張發票已經補登過了'); lastBad = Date.now(); }
      return false;
    }
    usedInvoices.add(no);
    name = '補登發票 ' + no;
    amt = parseInt(m[5],16) || DEMO_AMT;
  }
  S.receipts.push({name, amt, isNew:true});
  closeScan();
  renderHome();
  if(sheet.classList.contains('show')) renderSheet();
  toast(`補登成功 +${money(amt)}，已重新計算`);
  return true;
}

/* ===== 共用 ===== */
let tt;
function toast(msg){
  const t = $('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(tt); tt = setTimeout(()=>t.classList.remove('show'), 2200);
}

renderHome();
</script>
</body>
</html>
