<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LSP 打卡</title>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<style>
  :root {
    --bg: #f3f4f6;
    --line: #e3e6ea;
    --text: #1a1a1a;
    --sub: #6b7280;
    --muted: #8a8f98;
    --green: #2f9e6e;
    --green-bg: #e6f6ee;
    --card-blue: #2957a4;
    --logo-blue: #305bab;
    --logo-red: #bd0a0a;
    --ring: #3b82f6;
    --dark: #1f2937;
    --red: #dc2626;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #d9dce1; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    color: var(--text);
    -webkit-tap-highlight-color: transparent;
  }
  .app {
    position: relative;
    max-width: 430px;
    height: 100dvh;
    margin: 0 auto;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ---------- header ---------- */
  header {
    background: #fff;
    border-bottom: 4px solid var(--line);
    padding: calc(env(safe-area-inset-top) + 12px) 16px 10px;
    text-align: center;
    position: relative;
  }
  header h1 { font-size: 22px; font-weight: 800; letter-spacing: 1px; }
  .seg {
    margin: 8px auto 0;
    display: inline-flex;
    background: var(--bg);
    border-radius: 999px;
    padding: 4px;
  }
  .seg button {
    border: 0;
    background: transparent;
    font: inherit;
    font-size: 14px;
    font-weight: 700;
    color: var(--sub);
    padding: 7px 18px;
    border-radius: 999px;
    cursor: pointer;
  }
  .seg button.on { background: #fff; color: var(--green); box-shadow: 0 1px 3px rgba(0,0,0,.12); }

  main { flex: 1; overflow-y: auto; padding: 12px 16px 16px; }
  .view { display: none; }
  .view.on { display: block; }

  /* demo 用：右上角 GPS 範圍設定 */
  .gear {
    position: absolute; right: 12px; top: calc(env(safe-area-inset-top) + 10px);
    width: 32px; height: 32px; border: 0; border-radius: 50%;
    background: none; color: #b0b0b5; font-size: 19px; cursor: pointer;
  }

  /* ---------- scan view ---------- */
  .who { font-size: 14px; font-weight: 700; color: var(--sub); margin: 2px 6px 8px; }
  .shift {
    background: #fff;
    border-radius: 14px;
    padding: 12px 18px;
    position: relative;
    margin-bottom: 16px;
  }
  .shift .lbl { font-size: 13px; color: var(--muted); }
  .shift .main { font-size: 22px; font-weight: 800; margin-top: 2px; }
  .shift .main span { margin-left: 12px; }
  .shift .meta { font-size: 13px; color: var(--sub); margin-top: 2px; }
  .shift .day {
    position: absolute; right: 14px; top: 12px;
    background: #eef2f7; color: #4b5563;
    font-size: 12.5px; font-weight: 700;
    padding: 5px 12px; border-radius: 999px;
  }
  .scanbox {
    position: relative;
    width: min(270px, 78%);
    aspect-ratio: 1;
    margin: 0 auto;
    background: var(--dark);
    border-radius: 12px;
    overflow: hidden;
  }
  .scanbox video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .scanbox .corner { position: absolute; width: 34px; height: 34px; border: 5px solid #fff; z-index: 2; }
  .c1 { top: 14px; left: 14px; border-right: 0 !important; border-bottom: 0 !important; }
  .c2 { top: 14px; right: 14px; border-left: 0 !important; border-bottom: 0 !important; }
  .c3 { bottom: 14px; left: 14px; border-right: 0 !important; border-top: 0 !important; }
  .c4 { bottom: 14px; right: 14px; border-left: 0 !important; border-top: 0 !important; }
  .scanbox .hint {
    position: absolute; inset: 0; z-index: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    color: #fff; font-size: 18px; font-weight: 800; text-align: center; padding: 0 20px;
  }
  .scanbox.live .hint { display: none; }
  .scanline {
    display: none;
    position: absolute; left: 10%; right: 10%; height: 2px; z-index: 2;
    background: #4ade80; box-shadow: 0 0 10px #4ade80;
    animation: sweep 2s ease-in-out infinite;
  }
  .scanbox.live .scanline { display: block; }
  @keyframes sweep { 0%,100% { top: 14%; } 50% { top: 86%; } }
  .btn {
    display: block; width: 100%;
    border: 0; border-radius: 12px;
    font: inherit; font-size: 16px; font-weight: 700;
    padding: 13px; cursor: pointer;
  }
  .btn.primary { background: var(--green); color: #fff; }
  .btn.ghost { background: #fff; color: var(--sub); }
  .btn.small { width: auto; display: inline-block; padding: 9px 18px; font-size: 14px; }
  .actions { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
  .err {
    display: none;
    margin-top: 12px; padding: 10px 12px;
    background: #fef2f2; color: var(--red);
    border-radius: 10px; font-size: 13px; line-height: 1.5;
  }
  .err.on { display: block; }
  .status {
    margin-top: 14px; text-align: center; font-size: 13px; color: var(--sub);
  }
  .status b { color: var(--green); }
  .status .reset {
    border: 0; background: none; font: inherit; font-size: 12px;
    color: var(--sub); text-decoration: underline; margin-left: 6px; cursor: pointer;
  }

  /* ---------- nfc view ---------- */
  .idcard {
    background: var(--card-blue);
    border: 1px solid var(--dark);
    border-radius: 14px;
    color: #fff;
    padding: 22px 20px 20px;
  }
  .brand { display: flex; align-items: center; justify-content: center; gap: 16px; }
  .logo {
    width: 42px; height: 34px;
    background: var(--logo-blue);
    border: 1px solid #fff;
    display: flex; align-items: center;
  }
  .logo i { display: block; width: 100%; height: 13px; background: var(--logo-red); }
  .brand b { font-size: 21px; letter-spacing: 1px; }
  .photo {
    display: block;
    width: 124px; height: 144px;
    margin: 18px auto 0;
    padding: 0; border: 4px solid #fff; border-radius: 14px;
    background: #fff; overflow: hidden; cursor: pointer;
  }
  .photo svg { width: 100%; height: 100%; display: block; }
  .idcard .name { text-align: center; font-size: 27px; font-weight: 800; margin-top: 14px; }
  .idcard .eno { text-align: center; font-size: 17px; margin-top: 4px; letter-spacing: 1px; }
  .barcode {
    background: #fff; border-radius: 10px;
    width: 72%; margin: 14px auto 0; padding: 7px 12px 4px;
    color: var(--card-blue); text-align: center;
  }
  .barcode svg { display: block; width: 100%; height: 30px; }
  .barcode .num { font-size: 11px; font-weight: 700; letter-spacing: 1.5px; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .pick { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-top: 18px; }
  .pick button {
    border: 1px solid var(--line); background: #fff; color: var(--sub);
    font: inherit; font-size: 13px; font-weight: 700;
    padding: 6px 12px; border-radius: 999px; cursor: pointer;
  }
  .pick button.on { background: var(--card-blue); border-color: var(--card-blue); color: #fff; }
  .idcard hr { border: 0; border-top: 1.5px solid rgba(255,255,255,.85); margin: 18px 0 14px; }
  .idcard .row { display: flex; justify-content: space-between; align-items: center; }
  .idcard .lbl { font-size: 12.5px; }
  .idcard .main { font-size: 20px; font-weight: 800; margin-top: 2px; }
  .idcard .main span { margin-left: 14px; }
  .idcard .meta { font-size: 12px; margin-top: 2px; opacity: .95; }
  .idcard .day {
    border: 1.5px solid #fff; border-radius: 999px;
    font-size: 12px; font-weight: 700; padding: 4px 11px; white-space: nowrap;
  }
  .reopen { text-align: center; margin-top: 16px; }

  /* ---------- bottom nav ---------- */
  nav {
    display: flex;
    background: #fff;
    border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom);
    position: relative;
  }
  nav a {
    flex: 1; text-align: center; text-decoration: none;
    color: var(--sub); font-size: 12px; padding: 7px 0 8px;
  }
  nav a .ic { display: block; font-size: 23px; line-height: 1.2; }
  nav a.on { color: var(--green); font-weight: 700; position: relative; }
  nav a.on::before {
    content: ""; position: absolute; top: -1px; left: 22%; right: 22%;
    height: 3px; background: var(--green); border-radius: 2px;
  }

  /* ---------- bottom sheet ---------- */
  .mask {
    position: absolute; inset: 0; z-index: 20;
    background: rgba(0,0,0,.42);
    opacity: 0; pointer-events: none; transition: opacity .25s;
  }
  .mask.on { opacity: 1; pointer-events: auto; }
  .sheet {
    position: absolute; left: 8px; right: 8px; bottom: 8px; z-index: 21;
    background: #fff; border-radius: 34px;
    padding: 26px 24px calc(22px + env(safe-area-inset-bottom));
    text-align: center;
    transform: translateY(110%); transition: transform .3s cubic-bezier(.2,.8,.2,1);
  }
  .sheet.on { transform: translateY(0); }
  .sheet .x {
    position: absolute; top: 18px; right: 18px;
    width: 30px; height: 30px; border-radius: 50%;
    border: 0; background: #e5e7eb; color: #6b7280;
    font-size: 17px; font-weight: 700; cursor: pointer;
  }
  .sheet h2 { font-size: 24px; font-weight: 800; margin-top: 4px; }
  .sheet .sub { font-size: 14px; color: var(--sub); margin-top: 6px; min-height: 20px; }
  .sheet .icon {
    display: block; margin: 22px auto 26px;
    width: 140px; height: 140px;
    border: 0; background: none; cursor: pointer; padding: 0;
    position: relative;
  }
  .sheet .icon svg { width: 100%; height: 100%; display: block; }
  .sheet .icon.wait::after {
    content: ""; position: absolute; inset: 0; border-radius: 50%;
    border: 3px solid var(--ring);
    animation: pulse 1.6s ease-out infinite;
  }
  @keyframes pulse { 0% { transform: scale(1); opacity: .7; } 100% { transform: scale(1.35); opacity: 0; } }
  .sheet .icon.busy svg { animation: shake .5s ease-in-out infinite; }
  @keyframes shake { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-6deg); } 75% { transform: rotate(6deg); } }
  .done-ic { animation: pop .35s cubic-bezier(.3,1.6,.5,1); }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .result {
    background: var(--bg); border-radius: 14px;
    padding: 12px 16px; margin: -6px 0 18px; text-align: left;
    font-size: 14px; line-height: 1.8;
  }
  .result .k { color: var(--sub); display: inline-block; width: 72px; }
  .punch { font-size: 18px; font-weight: 800; color: var(--green); margin: -8px 0 18px; }
  .sheet .btn.cancel { background: #f2f2f7; color: var(--text); }
  .steps {
    background: var(--bg); border-radius: 14px;
    padding: 8px 14px; margin: 16px 0 14px; text-align: left; font-size: 14px;
  }
  .step { display: flex; gap: 10px; padding: 7px 0; }
  .step + .step { border-top: 1px solid rgba(0,0,0,.06); }
  .step .st {
    flex: none; width: 22px; height: 22px; margin-top: 1px; border-radius: 50%;
    display: grid; place-items: center; font-size: 13px; font-weight: 800; font-style: normal;
    color: #fff; background: #c7c7cc;
  }
  .step.ok .st { background: var(--green); }
  .step.alert .st { background: var(--alert); }
  .step.run .st { background: none; border: 2.5px solid var(--ring); border-top-color: transparent; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .step .d { color: var(--sub); font-size: 12.5px; line-height: 1.6; margin-top: 1px; }
  .tag { font-weight: 800; }
  .tag.in { color: var(--green); }
  .tag.out { color: var(--alert); }
  .sheet .icon.flow-ic { width: 96px; height: 96px; margin: 18px auto 12px; cursor: default; }
  .spin-ic { animation: spin 1s linear infinite; }
  .flow-msg { font-size: 18px; font-weight: 800; color: var(--sub); min-height: 26px; }
  .flow-msg.ok { color: var(--green); }
  .warn { font-size: 13px; color: var(--alert); margin-top: 4px; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .warn i {
    width: 16px; height: 16px; border-radius: 50%; background: var(--alert); color: #fff;
    font-size: 11px; font-weight: 800; font-style: normal; display: grid; place-items: center;
  }
  .status .bad { color: #e5484d; }
  :root { --alert: #e5484d; }   /* 警示色：與打卡紀錄的「位置異常」同為紅色 */
</style>
</head>
<body>
<div class="app">
  <header>
    <h1 id="title">掃碼打卡</h1>
    <button class="gear" data-range aria-label="GPS 範圍設定" title="GPS 範圍 300 公尺">⚙</button>
    <div class="seg">
      <button data-mode="scan" class="on">掃碼打卡</button>
      <button data-mode="nfc">感應打卡</button>
    </div>
  </header>

  <main>
    <!-- 掃碼 -->
    <section class="view on" id="v-scan">
      <div class="who">陳*儒 · 值班組</div>
      <div class="shift">
        <div class="lbl">今日班別</div>
        <div class="main">A1<span>07:30–16:30</span></div>
        <div class="meta">(8+1) · 休息 1 小時 · 工時 8h</div>
        <div class="day">1/5（二）D5</div>
      </div>
      <div class="scanbox" id="scanbox">
        <video id="video" playsinline muted></video>
        <div class="corner c1"></div><div class="corner c2"></div>
        <div class="corner c3"></div><div class="corner c4"></div>
        <div class="scanline"></div>
        <div class="hint">對準門店 QR Code</div>
      </div>
      <div class="actions">
        <button class="btn primary" id="btn-cam">開啟相機掃描</button>
      </div>
      <div class="err" id="err"></div>
      <div class="status" id="status-scan"></div>
    </section>

    <!-- 感應 -->
    <section class="view" id="v-nfc">
      <div class="idcard">
        <div class="brand"><div class="logo"><i></i></div><b>模擬福利中心</b></div>
        <button class="photo" id="photo" aria-label="切換照片"></button>
        <div class="name">陳*儒 · 值班組</div>
        <div class="eno">21077123</div>
        <div class="barcode">
          <svg id="barcode" preserveAspectRatio="none"></svg>
          <div class="num">1999 0041 1221 1674</div>
        </div>
        <hr>
        <div class="lbl">今日班別</div>
        <div class="row">
          <div class="main">A1<span>07:30–16:30</span></div>
          <div class="day">1/5（二）D5</div>
        </div>
        <div class="meta">(8+1) · 休息 1 小時 · 工時 8h</div>
      </div>
      <div class="pick" id="pick"></div>
      <div class="reopen"><button class="btn primary small" id="btn-nfc">開始感應</button></div>
      <div class="status" id="status-nfc"></div>
    </section>
  </main>

  <nav>
    <a href="#"><span class="ic">🏠</span>首頁</a>
    <a href="#"><span class="ic">📋</span>流程中心</a>
    <a href="#" class="on"><span class="ic">⏰</span>打卡</a>
    <a href="#"><span class="ic">🌴</span>排休假</a>
    <a href="#"><span class="ic">📅</span>班表</a>
  </nav>

  <div class="mask" id="mask"></div>
  <div class="sheet" id="sheet">
    <button class="x" id="sheet-x" aria-label="關閉">✕</button>
    <div id="sheet-body"></div>
  </div>
</div>

<script>
// 門店對照（storeid → 名稱），找不到就只顯示代碼
const STORES = {
  '2254105': { area: '北一處 內湖區', name: '內湖 瑞光' },
  '2254100': { area: '北一處 內湖區', name: '內湖 瑞光' },
};

const PHONE_SVG = `
<svg viewBox="0 0 140 140">
  <circle cx="70" cy="70" r="62" fill="#fff" stroke="#3b82f6" stroke-width="9"/>
  <rect x="46" y="28" width="48" height="84" rx="11" fill="#dbeafe" stroke="#3b82f6" stroke-width="5"/>
  <rect x="61" y="33" width="18" height="5" rx="2.5" fill="#3b82f6"/>
</svg>`;
const SPIN_SVG = `
<svg viewBox="0 0 140 140" class="spin-ic">
  <circle cx="70" cy="70" r="56" fill="none" stroke="#e5e7eb" stroke-width="12"/>
  <path d="M70 14 A56 56 0 0 1 126 70" fill="none" stroke="#2f9e6e" stroke-width="12" stroke-linecap="round"/>
</svg>`;
const CHECK_SVG = `
<svg viewBox="0 0 140 140" class="done-ic">
  <circle cx="70" cy="70" r="62" fill="#2f9e6e"/>
  <path d="M42 72 L62 92 L100 52" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
</svg>`;

const $ = id => document.getElementById(id);
const punches = [];   // { type, time, via, store, gpsOk }
let flowId = 0;       // 打卡確認流程序號；關閉 sheet 時 +1，讓進行中的流程作廢

// 門市 GPS 與允許範圍
const STORE_GPS = { lat: 25.080531, lng: 121.558319 };
let rangeM = 300;   // 可在頁面上調整，方便 demo 位置異常

// ---------- 打卡紀錄 ----------
function hhmm(d = new Date()) {
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}
function punch(via, store, gpsOk) {
  const type = punches.length % 2 === 0 ? '上班' : '下班';
  const p = { type, time: hhmm(), via, store, gpsOk };
  punches.push(p);
  renderStatus();
  if (navigator.vibrate) navigator.vibrate([60, 40, 60]);
  return p;
}
function renderStatus() {
  const txt = punches.length
    ? '今日打卡：' + punches.map(p => `<b>${p.time}</b>（${p.via}${p.gpsOk ? '' : '・<span class="bad">位置異常</span>'}）`).join('、')
      + '<button class="reset" data-reset>重設</button>'
    : '';
  $('status-scan').innerHTML = txt;
  $('status-nfc').innerHTML = txt;
}

// ---------- 分頁切換 ----------
let mode = 'scan';
document.querySelectorAll('.seg button').forEach(b => b.onclick = () => setMode(b.dataset.mode));
function setMode(m) {
  mode = m;
  document.querySelectorAll('.seg button').forEach(b => b.classList.toggle('on', b.dataset.mode === m));
  $('v-scan').classList.toggle('on', m === 'scan');
  $('v-nfc').classList.toggle('on', m === 'nfc');
  $('title').textContent = m === 'scan' ? '掃碼打卡' : '感應打卡';
  closeSheet();
  if (m === 'nfc') stopCamera();
}

// ---------- bottom sheet ----------
function openSheet(html) {
  $('sheet-body').innerHTML = html;
  $('mask').classList.add('on');
  $('sheet').classList.add('on');
}
function closeSheet() {
  $('mask').classList.remove('on');
  $('sheet').classList.remove('on');
  clearTimeout(nfcTimer);
  flowId++;
}
$('mask').onclick = closeSheet;
$('sheet-x').onclick = closeSheet;
$('sheet-body').addEventListener('click', e => {
  if (e.target.closest('[data-close]')) closeSheet();
});

// ---------- 打卡前確認：Wi-Fi → GPS → 完成 ----------
const sleep = ms => new Promise(r => setTimeout(r, ms));
const GPS_ERR = {
  0: '此瀏覽器不支援定位',
  1: '未允許定位（請到手機設定開啟瀏覽器定位權限）',
  2: '無法取得位置',
  3: '定位逾時',
};
function getGps() {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) return reject({ code: 0 });
    navigator.geolocation.getCurrentPosition(p => resolve(p.coords), reject,
      { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 });
  });
}
// 兩點距離（公尺，haversine）
function distM(a, b) {
  const toR = x => x * Math.PI / 180;
  const h = Math.sin(toR(b.lat - a.lat) / 2) ** 2
    + Math.cos(toR(a.lat)) * Math.cos(toR(b.lat)) * Math.sin(toR(b.lng - a.lng) / 2) ** 2;
  return 2 * 6371000 * Math.asin(Math.sqrt(h));
}
const fmtLatLng = (lat, lng) => lat.toFixed(6) + ', ' + lng.toFixed(6);
const fmtDist = m => m < 1000 ? Math.round(m) + ' 公尺' : (m / 1000).toFixed(1) + ' 公里';
function setStep(id, cls, html) {
  const el = $(id);
  el.className = 'step ' + cls;
  el.querySelector('.st').textContent = cls === 'ok' ? '✓' : cls === 'alert' ? '!' : '';
  el.querySelector('.d').innerHTML = html;
}
async function checkAndPunch({ via, title, sub, storeId }) {
  const id = ++flowId;
  const storeLine = '門市 ' + fmtLatLng(STORE_GPS.lat, STORE_GPS.lng);
  openSheet(`
    <h2>確認打卡條件</h2>
    <div class="sub">${sub}</div>
    <div class="icon flow-ic" id="flow-ic">${SPIN_SVG}</div>
    <div class="flow-msg" id="flow-msg">確認中…</div>
    <div id="flow-warn"></div>
    <div class="steps">
      <div class="step run" id="st-wifi"><i class="st"></i><div><b>門市 Wi-Fi</b><div class="d">確認中…</div></div></div>
      <div class="step" id="st-gps"><i class="st"></i><div><b>GPS 位置（範圍 ${rangeM} 公尺）</b><div class="d">等待中</div></div></div>
    </div>
    <button class="btn cancel" data-close>取消</button>`);
  await sleep(500);
  if (id !== flowId) return;
  setStep('st-wifi', 'ok', '已連線');
  setStep('st-gps', 'run', storeLine + '<br>定位中…');

  let gpsOk = false, html;
  try {
    const c = await getGps();
    if (id !== flowId) return;
    const d = distM(STORE_GPS, { lat: c.latitude, lng: c.longitude });
    gpsOk = d <= rangeM;
    html = `${storeLine}<br>實際 ${fmtLatLng(c.latitude, c.longitude)}（誤差 ±${Math.round(c.accuracy)} 公尺）<br>`
      + `距離 ${fmtDist(d)} → <span class="tag ${gpsOk ? 'in' : 'out'}">${gpsOk ? '範圍內' : '超出範圍'}</span>`;
  } catch (e) {
    if (id !== flowId) return;
    html = `${storeLine}<br><span class="tag out">${GPS_ERR[e.code] || '無法取得位置'}</span>`;
  }
  setStep('st-gps', gpsOk ? 'ok' : 'alert', html);
  await sleep(400);
  if (id !== flowId) return;

  const p = punch(via, storeId, gpsOk);
  $('sheet-body').querySelector('h2').textContent = title;
  $('flow-ic').innerHTML = CHECK_SVG;
  $('flow-msg').className = 'flow-msg ok';
  $('flow-msg').textContent = '打卡完成 ' + p.time;
  if (!gpsOk) $('flow-warn').innerHTML = '<div class="warn"><i>!</i>GPS 位置異常，已標記，待店長確認</div>';
  $('sheet-body').querySelector('[data-close]').textContent = '完成';
}

});

const C128 = '212222 222122 222221 121223 121322 131222 122213 122312 132212 221213 221312 231212 112232 122132 122231 113222 123122 123221 223211 221132 221231 213212 223112 312131 311222 321122 321221 312212 322112 322211 212123 212321 232121 111323 131123 131321 112313 132113 132311 211313 231113 231311 112133 112331 132131 113123 113321 133121 313121 211331 231131 213113 213311 213131 311123 311321 331121 312113 312311 332111 314111 221411 431111 111224 111422 121124 121421 141122 141221 112214 112412 122114 122411 142112 142211 241211 221114 413111 241112 134111 111242 121142 121241 114212 124112 124211 411212 421112 421211 212141 214121 412121 111143 111341 131141 114113 114311 411113 411311 113141 114131 311141 411131 211412 211214 211232'.split(' ');
function drawBarcode(svg, digits) {
  const codes = [105];
  for (let i = 0; i < digits.length; i += 2) codes.push(+digits.substr(i, 2));
  codes.push(codes.reduce((s, v, i) => s + v * (i || 1), 0) % 103);
  const pattern = codes.map(c => C128[c]).join('') + '2331112';
  const quiet = 10;
  let x = quiet, rects = '';
  [...pattern].forEach((w, i) => {
    if (i % 2 === 0) rects += `<rect x="${x}" y="0" width="${w}" height="1"/>`;
    x += +w;
  });
  svg.setAttribute('viewBox', `0 0 ${x + quiet} 1`);
  svg.setAttribute('fill', 'currentColor');
  svg.innerHTML = rects;
}
drawBarcode($('barcode'), '1999004112211674');

// ---------- 掃碼打卡 ----------
let stream = null, rafId = 0, lastBadAt = 0;
const canvas = document.createElement('canvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });

function showErr(msg) { $('err').innerHTML = msg; $('err').classList.toggle('on', !!msg); }

function parseStoreId(text) {
  const m = text.match(/storeid=(\d+)/i);
  if (m) return m[1];
  if (/^\d{5,}$/.test(text.trim())) return text.trim();
  return null;
}

async function startCamera() {
  showErr('');
  if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia) {
    showErr('此網址無法開啟相機（需 HTTPS 或 localhost）。');
    return;
  }
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' } }, audio: false,
    });
  } catch (e) {
    showErr(e.name === 'NotAllowedError'
      ? '相機權限被拒絕，請到瀏覽器設定允許相機後再試。'
      : '無法開啟相機：' + e.message);
    return;
  }
  const v = $('video');
  v.srcObject = stream;
  await v.play();
  $('scanbox').classList.add('live');
  $('btn-cam').textContent = '關閉相機';
  tick();
}

function stopCamera() {
  cancelAnimationFrame(rafId);
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null;
  $('video').srcObject = null;
  $('scanbox').classList.remove('live');
  $('btn-cam').textContent = '開啟相機掃描';
}

function tick() {
  const v = $('video');
  if (!stream) return;
  if (v.readyState >= 2 && v.videoWidth) {
    // 縮到最長邊 640 再解碼，手機上比較順
    const s = Math.min(1, 640 / Math.max(v.videoWidth, v.videoHeight));
    canvas.width = v.videoWidth * s;
    canvas.height = v.videoHeight * s;
    ctx.drawImage(v, 0, 0, canvas.width, canvas.height);
    const code = decode(ctx.getImageData(0, 0, canvas.width, canvas.height));
    if (code && handleCode(code)) return;
  }
  rafId = requestAnimationFrame(tick);
}

function decode(img) {
  const r = jsQR(img.data, img.width, img.height, { inversionAttempts: 'dontInvert' });
  return r ? r.data : null;
}

// 回傳 true 代表已完成（停止掃描）
function handleCode(text) {
  const id = parseStoreId(text);
  if (!id) {
    if (Date.now() - lastBadAt > 2000) {
      lastBadAt = Date.now();
      showErr('這不是門店 QR Code：' + text.replace(/</g, '&lt;'));
    }
    return false;
  }
  stopCamera();
  showErr('');
  const store = STORES[id];
  checkAndPunch({
    via: '掃碼', title: '掃描完成', storeId: id,
    sub: store ? `${store.area} · ${store.name}（${id}）` : `門店 ${id}`,
  });
  return true;
}

$('btn-cam').onclick = () => stream ? stopCamera() : startCamera();
setMode('nfc');   // 預設進感應打卡
